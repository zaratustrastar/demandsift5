name: Apply concept market gate and qualifier fix

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/apply-concept-gate-fix.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: github.actor == 'zaratustrastar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply concept gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '' | base64 -d | gzip -d > /tmp/concept-gate.patch
          git apply --check /tmp/concept-gate.patch
          git apply /tmp/concept-gate.patch

      - name: Preserve short semantic qualifiers in query planning
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PYFIX'
          from pathlib import Path
          p = Path('lib/providers/reddit.server.ts')
          text = p.read_text()

          old_tail = '''  "or", "is", "be", "being", "been", "lengthy", "new", "start", "starts", "starting",
]);'''
          new_tail = '''  "or", "is", "be", "being", "been", "lengthy", "new", "start", "starts", "starting",
  "am", "as", "at", "by", "do", "go", "he", "if", "in", "it", "me", "my", "no",
  "on", "so", "up", "us", "we",
]);'''
          if old_tail not in text:
              raise SystemExit('stop-word anchor not found')
          text = text.replace(old_tail, new_tail, 1)

          old_problem = '''function problemTokens(value: string): string[] {
  return normalizeSearchText(value)
    .split(" ")
    .filter((token) => token.length >= 3 && !PROBLEM_TOKEN_STOP_WORDS.has(token));
}'''
          new_problem = '''function problemTokens(value: string): string[] {
  return normalizeSearchText(value)
    .split(" ")
    .filter((token) => token.length >= 2 && !PROBLEM_TOKEN_STOP_WORDS.has(token));
}'''
          if old_problem not in text:
              raise SystemExit('problemTokens anchor not found')
          text = text.replace(old_problem, new_problem, 1)

          old_category = '''  const categoryExpression = (value: string): string => {
    const tokens = problemTokens(value);
    if (tokens.length === 0) return "";
    const selected = tokens.slice(0, 2);
    const descriptor = tokens.find((token) =>
      /^(?:app|apps|platform|software|system|tool|tools)$/.test(token),
    );
    if (descriptor && !selected.includes(descriptor)) selected.push(descriptor);
    return selected.join(" ");
  };'''
          new_category = '''  const categoryExpression = (value: string): string => {
    const tokens = problemTokens(value);
    if (tokens.length === 0) return "";
    const selected = tokens.slice(0, 5);
    const descriptor = tokens.find((token) =>
      /^(?:app|apps|platform|software|system|tool|tools)$/.test(token),
    );
    if (descriptor && !selected.includes(descriptor)) {
      if (selected.length >= 5) selected[selected.length - 1] = descriptor;
      else selected.push(descriptor);
    }
    return selected.join(" ");
  };'''
          if old_category not in text:
              raise SystemExit('categoryExpression anchor not found')
          text = text.replace(old_category, new_category, 1)

          old_seed = '''    const seedTokens = seed
      .split(" ")
      .filter(
        (token) =>
          token.length >= 3 &&
          !PROBLEM_TOKEN_STOP_WORDS.has(token),
      )
      .slice(0, 6);'''
          new_seed = '''    const seedTokens = problemTokens(seed).slice(0, 6);'''
          if old_seed not in text:
              raise SystemExit('seedTokens anchor not found')
          text = text.replace(old_seed, new_seed, 1)
          p.write_text(text)
          PYFIX

      - name: Add regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '' | base64 -d | gzip -d > tests/concept-gate-market-evidence.test.mjs
          cat >> tests/concept-gate-market-evidence.test.mjs <<'EOF'

test("query planning preserves critical market qualifiers", () => {
  assert.ok(
    tvcpPlan.some((entry) => entry.query === "looking for android tv parental control app"),
    JSON.stringify(tvcpPlan),
  );
  assert.ok(
    tvcpPlan.some((entry) => entry.query.includes("kids watching tv too long")),
    JSON.stringify(tvcpPlan),
  );
  assert.ok(
    tvcpPlan.every((entry) => entry.query !== "looking for android parental app"),
    JSON.stringify(tvcpPlan),
  );
});
EOF

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - run: npm ci
      - run: node --test tests/concept-gate-market-evidence.test.mjs
      - run: node --test tests/apify-reddit-provider.test.mjs
      - run: node --test tests/reddit-intelligence-pipeline.test.mjs
      - run: npm run build
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: git diff --check

      - name: Commit fully verified search relevance fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/contracts.ts lib/providers/reddit.server.ts tests/concept-gate-market-evidence.test.mjs
          git commit -m "Preserve market qualifiers and gate Reddit discovery on concept evidence"
          git push origin HEAD:feature/reddit-intelligence-pipeline
