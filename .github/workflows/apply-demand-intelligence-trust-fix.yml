name: Apply demand-intelligence trust fix

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/apply-demand-intelligence-trust-fix.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Write audited source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("lib/server/contracts.ts").write_bytes(base64.b64decode(""))
          Path("lib/providers/openai.server.ts").write_bytes(base64.b64decode(""))
          Path("lib/server/scan-workflow.ts").write_bytes(base64.b64decode(""))
          Path("lib/server/presenter.ts").write_bytes(base64.b64decode(""))
          Path("components/demand-intelligence/types.ts").write_bytes(base64.b64decode(""))
          Path("components/demand-intelligence/from-scan.ts").write_bytes(base64.b64decode(""))
          Path("components/demand-intelligence/ProductDashboard.tsx").write_bytes(base64.b64decode(""))
          Path("tests/openai-intelligence-pipeline.test.mjs").write_bytes(base64.b64decode(""))
          Path("tests/demand-intelligence-trust.test.mjs").write_bytes(base64.b64decode(""))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused regressions
        run: node --test tests/openai-intelligence-pipeline.test.mjs tests/demand-intelligence-trust.test.mjs tests/reddit-intelligence-pipeline.test.mjs tests/presenter-result-totals.test.mjs
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Full tests
        run: node --test tests/*.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit and push validated patch
        shell: bash
        run: |
          git config user.name "DemandSift CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- "lib/server/contracts.ts" "lib/providers/openai.server.ts" "lib/server/scan-workflow.ts" "lib/server/presenter.ts" "components/demand-intelligence/types.ts" "components/demand-intelligence/from-scan.ts" "components/demand-intelligence/ProductDashboard.tsx" "tests/openai-intelligence-pipeline.test.mjs" "tests/demand-intelligence-trust.test.mjs"
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Make demand intelligence directly auditable"
          git push origin HEAD:feature/reddit-intelligence-pipeline
