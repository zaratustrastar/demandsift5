name: Apply MVP transparency and enrichment recovery

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/apply-mvp-transparency-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'zaratustrastar'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/apply_mvp_transparency_recovery.py
          sed -i 's/    let selectedForEnrichment = \[/    const selectedForEnrichment = [/' lib/server/scan-workflow.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Commit implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "zaratustrastar"
          git config user.email "114620206+zaratustrastar@users.noreply.github.com"
          git add \
            lib/server/contracts.ts \
            lib/server/scan-workflow.ts \
            lib/server/presenter.ts \
            components/demand-intelligence/types.ts \
            components/demand-intelligence/from-scan.ts \
            components/demand-intelligence/ProductDashboard.tsx \
            components/ThreadlineExperience.tsx \
            tests/scan-pipeline-architecture.test.mjs \
            tests/mvp-scan-transparency.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "Keep partial scans useful and expose MVP scan trace"
          git push origin HEAD:feature/reddit-intelligence-pipeline
