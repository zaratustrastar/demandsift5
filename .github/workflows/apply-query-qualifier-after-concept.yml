name: Apply Reddit query qualifier preservation

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/apply-query-qualifier-after-concept.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: github.actor == 'zaratustrastar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Preserve critical short qualifiers in Reddit queries
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '' | base64 -d | gzip -d > /tmp/apply-query-qualifiers.py
          python3 /tmp/apply-query-qualifiers.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - run: npm ci
      - run: node --test tests/concept-gate-market-evidence.test.mjs
      - run: node --test tests/apify-reddit-provider.test.mjs
      - run: node --test tests/reddit-intelligence-pipeline.test.mjs
      - run: npm run build
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: git diff --check

      - name: Commit fully verified qualifier preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/reddit.server.ts tests/concept-gate-market-evidence.test.mjs
          git commit -m "Preserve critical qualifiers in Reddit search planning"
          git push origin HEAD:feature/reddit-intelligence-pipeline
