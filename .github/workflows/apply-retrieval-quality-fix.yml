name: Apply Reddit retrieval quality fix

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/apply-retrieval-quality-fix.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: github.actor == 'zaratustrastar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply source and test portion of verified retrieval patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          historical = subprocess.run(
              ["git", "show", "8e075e0d17d5eea72979e5364acd4ff2306e2699:.github/workflows/apply-retrieval-quality-fix.yml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          start_marker = "          python3 <<'PY'\n"
          end_marker = "          PY\n\n      - uses: actions/setup-node@v4"
          start = historical.index(start_marker) + len(start_marker)
          end = historical.index(end_marker, start)
          script_lines = historical[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines) + "\n"
          exec(compile(script, "historical-retrieval-patch.py", "exec"), {})

          # The generic fixture only supplies two customerProblems. Preserve the
          # stronger Basecamp-specific assertion of three pain lanes while making
          # the generic assertion reflect the fixture's actual evidence supply.
          tests = Path("tests/apify-reddit-provider.test.mjs")
          text = tests.read_text()
          old = "  assert.ok(counts.problem_pain >= 3, JSON.stringify(plan));\n"
          new = "  assert.ok(counts.problem_pain >= 2, JSON.stringify(plan));\n"
          if text.count(old) != 1:
              raise SystemExit("expected one generic problem_pain assertion after historical patch")
          tests.write_text(text.replace(old, new, 1))
          PY

          # Workflow files require a stronger token scope than GITHUB_TOKEN.
          # Keep workflow changes out of this bot push; manage diagnostics through
          # the GitHub connector after the source patch has passed tests.
          git restore --source=HEAD -- .github/workflows/apply-retrieval-quality-fix.yml .github/workflows/ci.yml
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --test tests/apify-reddit-provider.test.mjs tests/reddit-intelligence-pipeline.test.mjs tests/scan-pipeline-architecture.test.mjs tests/latest-scan-restoration.test.mjs
      - run: git diff --check

      - name: Commit verified source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/reddit.server.ts tests/apify-reddit-provider.test.mjs
          git commit -m "Improve Reddit demand retrieval quality"
          git push origin HEAD:feature/reddit-intelligence-pipeline
