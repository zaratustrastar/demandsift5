name: Apply Reddit retrieval quality fix

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/apply-retrieval-quality-fix.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: github.actor == 'zaratustrastar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply high-recall posts plus comments discovery and semantic acceptance evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          reddit = "lib/providers/reddit.server.ts"
          replace_once(reddit, "  searchComments: false;\n", "  searchComments: true;\n")
          replace_once(
              reddit,
              '''  const problems = cleanUnique(request.queries.customerProblems, 8);\n  const jobs = cleanUnique(request.queries.jobsToBeDone ?? [], 10);''',
              '''  const problems = cleanUnique(request.queries.customerProblems, 8);\n  const genericProblemTokens = new Set([\n    "better", "business", "difficult", "hard", "help", "manage", "managing",\n    "need", "needs", "problem", "problems", "process", "solution", "team",\n    "tool", "tools", "work", "workflow",\n  ]);\n  const problemSpecificityScore = (value: string): number => {\n    const tokens = problemTokens(value).slice(0, 8);\n    const specific = tokens.filter((token) => !genericProblemTokens.has(token));\n    return (specific.length * 4) + Math.min(tokens.length, 6);\n  };\n  const rankedProblems = [...problems].sort((left, right) =>\n    problemSpecificityScore(right) - problemSpecificityScore(left),\n  );\n  const jobs = cleanUnique(request.queries.jobsToBeDone ?? [], 10);''',
          )
          replace_once(reddit, "    problems[0] ??\n    productTerms[0] ??", "    rankedProblems[0] ??\n    productTerms[0] ??")
          replace_once(reddit, "  for (const seed of [...problems, ...jobs].slice(0, 8)) {", "  for (const seed of [...rankedProblems, ...jobs].slice(0, 8)) {")
          replace_once(reddit, "  for (const seed of problems.slice(0, 8)) {", "  for (const seed of rankedProblems.slice(0, 8)) {")
          replace_once(
              reddit,
              '''  const quotas: Array<[DemandLane, number]> = [\n    ["direct_buying_intent", 2],\n    ["problem_pain", 2],\n    ["competitor_switching", 1],\n    ["category_recommendation", 1],\n    ["brand_competitor_mentions", 1],\n    ["workaround", 1],\n    ["timing", 1],\n  ];''',
              '''  // Reserve most of the bounded plan for concrete demand. Category/brand\n  // searches remain fallback coverage only when evidence-backed pools are thin.\n  const quotas: Array<[DemandLane, number]> = [\n    ["direct_buying_intent", 2],\n    ["problem_pain", 3],\n    ["competitor_switching", 1],\n    ["workaround", 1],\n    ["timing", 1],\n  ];''',
          )
          replace_once(
              reddit,
              '''  const laneOrder: DemandLane[] = [\n    "direct_buying_intent",\n    "problem_pain",\n    "competitor_switching",\n    "category_recommendation",\n    "brand_competitor_mentions",\n    "workaround",\n    "timing",\n  ];''',
              '''  const laneOrder: DemandLane[] = [\n    "problem_pain",\n    "direct_buying_intent",\n    "competitor_switching",\n    "workaround",\n    "timing",\n    "category_recommendation",\n    "brand_competitor_mentions",\n  ];''',
          )
          replace_once(
              reddit,
              '''    const maxItems = Math.min(\n      this.maximumItems,\n      Math.max(30, Math.min(36, request.limit * 2)),\n    );''',
              '''    // Keep the post cap bounded while leaving room in maxItems for direct\n    // comment-search hits. This avoids recursively scraping comment trees here.\n    const maxItems = Math.min(\n      this.maximumItems,\n      Math.max(36, Math.min(50, request.limit * 2)),\n    );''',
          )
          replace_once(
              reddit,
              '''      searchPosts: true,\n      searchComments: false,''',
              '''      searchPosts: true,\n      // Direct comment search is lightweight discovery. skipComments stays true\n      // so full thread context is still paid for only during enrichment.\n      searchComments: true,''',
          )

          tests = "tests/apify-reddit-provider.test.mjs"
          replace_once(
              tests,
              '''  assert.deepEqual(counts, {\n    direct_buying_intent: 2,\n    problem_pain: 2,\n    competitor_switching: 1,\n    category_recommendation: 1,\n    brand_competitor_mentions: 1,\n    workaround: 1,\n    timing: 1,\n  });''',
              '''  assert.ok(counts.direct_buying_intent >= 2, JSON.stringify(plan));\n  assert.ok(counts.problem_pain >= 3, JSON.stringify(plan));\n  assert.ok(counts.competitor_switching >= 1, JSON.stringify(plan));\n  assert.ok(counts.workaround >= 1, JSON.stringify(plan));\n  assert.ok(counts.timing >= 1, JSON.stringify(plan));\n  assert.ok(\n    counts.category_recommendation + counts.brand_competitor_mentions <= 1,\n    "secondary category/brand searches must not crowd out demand lanes",\n  );''',
          )
          replace_once(
              tests,
              '''  assert.equal(\n    plan.filter((entry) => entry.lane === "category_recommendation").length,\n    1,\n  );\n\n  assert.equal(\n    plan.filter((entry) => entry.lane === "brand_competitor_mentions").length,\n    1,\n  );''',
              '''  assert.equal(\n    plan.filter((entry) => entry.lane === "problem_pain").length,\n    3,\n  );\n\n  assert.equal(\n    plan.filter((entry) =>\n      entry.lane === "category_recommendation" ||\n      entry.lane === "brand_competitor_mentions"\n    ).length,\n    0,\n  );''',
          )
          replace_once(tests, "  assert.equal(discovery.searchComments, false);", "  assert.equal(discovery.searchComments, true);")
          replace_once(tests, "  assert.equal(discovery.maxItems, 36);", "  assert.equal(discovery.maxItems, 40);")
          replace_once(tests, "  assert.equal(startCall.url.searchParams.get(\"maxItems\"), \"36\");", "  assert.equal(startCall.url.searchParams.get(\"maxItems\"), \"40\");")

          ci = ".github/workflows/ci.yml"
          replace_once(
              ci,
              '''          latest_json="$(mktemp)"\n          trap 'rm -f "$cookie_jar" "$created_json" "$latest_json"' EXIT''',
              '''          latest_json="$(mktemp)"\n          diagnostics_html="$(mktemp)"\n          trap 'rm -f "$cookie_jar" "$created_json" "$latest_json" "$diagnostics_html"' EXIT''',
          )
          replace_once(
              ci,
              '''          print("stored_replies=" + str(stored.get("replies") or 0))\n          PY\n              exit 0''',
              '''          print("stored_replies=" + str(stored.get("replies") or 0))\n          PY\n              curl --fail-with-body --silent --show-error \\\n                --cookie "$cookie_jar" \\\n                "$APP_URL/acceptance-diagnostics" > "$diagnostics_html"\n              python3 - "$diagnostics_html" <<'PY'\n          import html, json, re, sys\n          raw = open(sys.argv[1], encoding="utf-8").read()\n          match = re.search(r"<pre>(.*?)</pre>", raw, flags=re.S)\n          if not match:\n              raise SystemExit("acceptance diagnostics payload missing")\n          payload = json.loads(html.unescape(match.group(1)))\n          diagnostics = payload.get("diagnostics") or {}\n          retrieval = payload.get("retrievalDiagnostics") or {}\n          states = payload.get("processedRedditState") or []\n          output = payload.get("output") or {}\n          print("semantic_search_plan=" + json.dumps(retrieval.get("searchPlan") or [], ensure_ascii=False, separators=(",", ":")))\n          print("semantic_diagnostics=" + json.dumps(diagnostics, ensure_ascii=False, separators=(",", ":")))\n          print("semantic_lane_counts=" + json.dumps({\n              "matched": retrieval.get("matchedCandidatesByLane"),\n              "worth": retrieval.get("worthEnrichingByLane"),\n              "matchedByQuery": retrieval.get("matchedCandidatesByQuery"),\n              "worthByQuery": retrieval.get("worthEnrichingByQuery"),\n          }, ensure_ascii=False, separators=(",", ":")))\n          for index, state in enumerate(states[:50], 1):\n              print("semantic_candidate=" + json.dumps({\n                  "n": index,\n                  "id": state.get("externalId"),\n                  "subreddit": state.get("subreddit"),\n                  "title": (state.get("title") or "")[:220],\n                  "excerpt": (state.get("excerpt") or "")[:450],\n                  "url": state.get("canonicalPermalink"),\n                  "queries": state.get("matchedQueries"),\n                  "lanes": state.get("discoveryLanes"),\n                  "triage": state.get("triage"),\n                  "deep": state.get("deepQualification"),\n                  "replyStatus": state.get("replyStatus"),\n              }, ensure_ascii=False, separators=(",", ":")))\n          potential = int(diagnostics.get("uniquePotentialCustomers") or diagnostics.get("potentialCustomerConversations") or 0)\n          replies = int(output.get("replies") or 0)\n          if potential < 1 or replies < 1:\n              print(f"acceptance_quality=failed potential={potential} replies={replies}")\n              raise SystemExit(2)\n          print(f"acceptance_quality=passed potential={potential} replies={replies}")\n          PY\n              exit 0''',
          )

          Path(".github/workflows/apply-retrieval-quality-fix.yml").unlink()
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --test tests/apify-reddit-provider.test.mjs tests/reddit-intelligence-pipeline.test.mjs tests/scan-pipeline-architecture.test.mjs tests/latest-scan-restoration.test.mjs
      - run: git diff --check

      - name: Commit verified retrieval quality patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Reddit demand retrieval and semantic acceptance"
          git push origin HEAD:feature/reddit-intelligence-pipeline
