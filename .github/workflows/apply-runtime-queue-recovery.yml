name: Apply runtime queue recovery

on:
  push:
    branches:
      - diagnostic/runtime-queue-20260814
    paths:
      - .github/workflows/apply-runtime-queue-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply resumable execution and heartbeat lease
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # A scan marked running must be resumable after the web process loses
          # the detached execution that originally owned it.
          replace_once(
              "lib/server/scan-workflow.ts",
              '''export async function runScan(scanId: string): Promise<ScanRecord> {
            const repository = getStateRepository();
            const claim = await repository.beginScanRun(scanId);
            if (claim.state === "missing" || !claim.scan) {
              throw new ApiError("Scan was not found.", 404, "scan_not_found");
            }
            if (claim.state === "complete") return claim.scan;
            if (claim.state === "running") return claim.scan;
            const scan = claim.scan;
          ''',
              '''export async function runScan(
            scanId: string,
            options: { resumeRunning?: boolean } = {},
          ): Promise<ScanRecord> {
            const repository = getStateRepository();
            const claim = await repository.beginScanRun(scanId);
            if (claim.state === "missing" || !claim.scan) {
              throw new ApiError("Scan was not found.", 404, "scan_not_found");
            }
            if (claim.state === "complete") return claim.scan;
            if (claim.state === "running" && !options.resumeRunning) return claim.scan;
            const scan = claim.scan;
          ''',
          )

          # Keep one execution promise per scan inside a web process. Repeated
          # worker polls reuse it. If the web process restarted, the registry is
          # empty and a persisted running scan is safely resumed from stage one.
          replace_once(
              "app/api/internal/jobs/[jobId]/execute/route.ts",
              '''async function executeClaimedScan(scanId: string): Promise<void> {
            try {
              await runScan(scanId);
            } catch (error) {
              // runScan durably records the failed scan before rejecting. The worker
              // observes that terminal state through short polling requests, so this
              // background task must never become an unhandled rejection.
              if (error instanceof OpenAiProviderError && /structured (?:chat )?(?:JSON|output)/i.test(error.message)) {
                console.error("Background scan exhausted structured AI recovery.");
                return;
              }
              console.error("Background scan execution failed.", error);
            }
          }
          ''',
              '''const activeScanExecutions = new Map<string, Promise<void>>();

          async function executeClaimedScan(
            scanId: string,
            resumeRunning = false,
          ): Promise<void> {
            try {
              await runScan(scanId, { resumeRunning });
            } catch (error) {
              // runScan durably records the failed scan before rejecting. The worker
              // observes that terminal state through short polling requests, so this
              // background task must never become an unhandled rejection.
              if (error instanceof OpenAiProviderError && /structured (?:chat )?(?:JSON|output)/i.test(error.message)) {
                console.error("Background scan exhausted structured AI recovery.");
                return;
              }
              console.error("Background scan execution failed.", error);
            }
          }

          function ensureClaimedScanExecution(
            scanId: string,
            resumeRunning = false,
          ): Promise<void> {
            const existing = activeScanExecutions.get(scanId);
            if (existing) return existing;
            const execution = executeClaimedScan(scanId, resumeRunning);
            activeScanExecutions.set(scanId, execution);
            void execution.finally(() => {
              if (activeScanExecutions.get(scanId) === execution) {
                activeScanExecutions.delete(scanId);
              }
            });
            return execution;
          }
          ''',
          )

          replace_once(
              "app/api/internal/jobs/[jobId]/execute/route.ts",
              '''    if (scan.status === "complete" || scan.status === "failed" || scan.status === "running") {
              return Response.json(executionSnapshot(job, scan), {
                status: scan.status === "running" ? 202 : 200,
                headers: { "cache-control": "no-store" },
              });
            }

            // The VPS is a persistent Node process, not a request-scoped serverless
            // function. Start the durable scan and release the HTTP request immediately.
            // Worker and browser status checks are then independent short requests, so
            // no proxy/server timeout can terminate a long-running scan.
            void executeClaimedScan(scan.id);
            return Response.json(
          ''',
              '''    if (scan.status === "complete" || scan.status === "failed") {
              return Response.json(executionSnapshot(job, scan), {
                status: 200,
                headers: { "cache-control": "no-store" },
              });
            }
            if (scan.status === "running") {
              // A repeated worker poll normally finds the promise already registered.
              // If this web process restarted, the registry is empty: resume the
              // persisted running scan instead of leaving the queue blocked forever.
              void ensureClaimedScanExecution(scan.id, true);
              return Response.json(executionSnapshot(job, scan), {
                status: 202,
                headers: { "cache-control": "no-store" },
              });
            }

            // The VPS is a persistent Node process, not a request-scoped serverless
            // function. Start the durable scan and release the HTTP request immediately.
            // Worker and browser status checks are then independent short requests, so
            // no proxy/server timeout can terminate a long-running scan.
            void ensureClaimedScanExecution(scan.id, false);
            return Response.json(
          ''',
          )

          # Replace the old 25-minute-style stale lock with a heartbeat lease. A
          # healthy long scan keeps the lease fresh; a dead worker becomes reclaimable
          # quickly without shortening the scan execution timeout itself.
          replace_once(
              "scripts/background-worker.mjs",
              '''export function jobExecutionConfiguration(environment = process.env) {
            const timeoutSeconds = boundedNumber(
              environment.BACKGROUND_JOB_TIMEOUT_SECONDS,
              1_200,
              1_200,
              1_800,
            );
            const configuredStaleSeconds = boundedNumber(
              environment.BACKGROUND_JOB_STALE_SECONDS,
              timeoutSeconds + 300,
              60,
              3_600,
            );
            return {
              timeoutSeconds,
              staleSeconds: Math.max(configuredStaleSeconds, timeoutSeconds + 300),
            };
          }

          export async function claimJob(sql, workerIdValue) {
          ''',
              '''export function jobExecutionConfiguration(environment = process.env) {
            const timeoutSeconds = boundedNumber(
              environment.BACKGROUND_JOB_TIMEOUT_SECONDS,
              1_200,
              1_200,
              1_800,
            );
            const heartbeatSeconds = boundedNumber(
              environment.BACKGROUND_JOB_HEARTBEAT_SECONDS,
              15,
              5,
              60,
            );
            const configuredStaleSeconds = boundedNumber(
              environment.BACKGROUND_JOB_LEASE_STALE_SECONDS,
              90,
              45,
              300,
            );
            return {
              timeoutSeconds,
              heartbeatSeconds,
              staleSeconds: Math.max(configuredStaleSeconds, heartbeatSeconds * 3),
            };
          }

          export async function refreshJobLease(sql, jobId, workerIdValue) {
            const rows = await sql`
              UPDATE background_jobs
              SET locked_at = now(),
                  updated_at = now()
              WHERE id = ${jobId}
                AND status = 'running'
                AND locked_by = ${workerIdValue}
              RETURNING id
            `;
            return rows.length > 0;
          }

          export async function maintainJobLease(sql, job, workerIdValue, signal, heartbeatMs) {
            while (!signal.aborted) {
              await waitForNextPoll(signal, heartbeatMs);
              if (signal.aborted) return;
              try {
                const refreshed = await refreshJobLease(sql, job.id, workerIdValue);
                if (!refreshed) {
                  log("warn", "job_lease_lost", { jobId: job.id });
                  return;
                }
              } catch (error) {
                // One transient database failure must not abort an otherwise healthy
                // scan. The lease window allows several heartbeat attempts.
                log("warn", "job_lease_refresh_failed", {
                  jobId: job.id,
                  message: error instanceof Error ? error.message : String(error),
                });
              }
            }
          }

          export async function claimJob(sql, workerIdValue) {
          ''',
          )

          replace_once(
              "scripts/background-worker.mjs",
              '''      log("info", "job_claimed", {
                jobId: job.id,
                type: job.type,
                attempt: job.attempts,
                maxAttempts: job.max_attempts,
              });
              try {
                const result = await executeScanJob(job, queueSignal);
                await completeJob(sql, job);
                log("info", "job_succeeded", { jobId: job.id, scanId: result.scanId });
              } catch (error) {
                const disposition = jobFailureDisposition(job, error);
                await failJob(sql, job, error, disposition);
                log("error", "job_failed", {
                  jobId: job.id,
                  attempt: job.attempts,
                  retryable: disposition.retryable,
                  terminal: disposition.terminal,
                  message: error instanceof Error ? error.message : String(error),
                });
              }
          ''',
              '''      log("info", "job_claimed", {
                jobId: job.id,
                type: job.type,
                attempt: job.attempts,
                maxAttempts: job.max_attempts,
              });
              const leaseController = new AbortController();
              const leaseSignal = AbortSignal.any([queueSignal, leaseController.signal]);
              const { heartbeatSeconds } = jobExecutionConfiguration();
              const leaseTask = maintainJobLease(
                sql,
                job,
                workerId,
                leaseSignal,
                heartbeatSeconds * 1_000,
              );
              try {
                const result = await executeScanJob(job, queueSignal);
                await completeJob(sql, job);
                log("info", "job_succeeded", { jobId: job.id, scanId: result.scanId });
              } catch (error) {
                const disposition = jobFailureDisposition(job, error);
                await failJob(sql, job, error, disposition);
                log("error", "job_failed", {
                  jobId: job.id,
                  attempt: job.attempts,
                  retryable: disposition.retryable,
                  terminal: disposition.terminal,
                  message: error instanceof Error ? error.message : String(error),
                });
              } finally {
                leaseController.abort("job finished");
                await leaseTask;
              }
          ''',
          )

          # Keep deployment documentation aligned with the new lease mechanism.
          replace_once(
              "deploy/vps.env.example",
              '''BACKGROUND_JOB_POLL_MS=2000
          BACKGROUND_JOB_TIMEOUT_SECONDS=900
          BACKGROUND_JOB_STALE_SECONDS=1200
          ''',
              '''BACKGROUND_JOB_POLL_MS=2000
          BACKGROUND_JOB_TIMEOUT_SECONDS=900
          BACKGROUND_JOB_HEARTBEAT_SECONDS=15
          BACKGROUND_JOB_LEASE_STALE_SECONDS=90
          ''',
          )

          # Regression coverage: the executor must be able to resume an orphaned
          # persisted run, while the worker lease keeps legitimate long work owned.
          replace_once(
              "tests/scan-pipeline-architecture.test.mjs",
              '''test("long-running scans start durably and are observed through short polling requests", () => {
            assert.equal(executorRoute.includes("ReadableStream"), false);
            assert.match(executorRoute, /void executeClaimedScan\\(scan\\.id\\)/);
            assert.match(executorRoute, /status: "starting", complete: false/);
            assert.match(executorRoute, /scan\\.status === "running" \\? 202 : 200/);
            assert.match(executorRoute, /export async function GET/);
            assert.match(executorRoute, /executionSnapshot\\(job, scan\\)/);
          });
          ''',
              '''test("long-running scans start durably and recover an orphaned running execution", () => {
            assert.equal(executorRoute.includes("ReadableStream"), false);
            assert.match(executorRoute, /activeScanExecutions/);
            assert.match(executorRoute, /ensureClaimedScanExecution\\(scan\\.id, false\\)/);
            assert.match(executorRoute, /ensureClaimedScanExecution\\(scan\\.id, true\\)/);
            assert.match(executorRoute, /status: "starting", complete: false/);
            assert.match(executorRoute, /export async function GET/);
            assert.match(executorRoute, /executionSnapshot\\(job, scan\\)/);
            assert.match(source, /options: \\{ resumeRunning\\?: boolean \\} = \\{\\}/);
            assert.match(source, /claim\\.state === "running" && !options\\.resumeRunning/);
          });
          ''',
          )

          replace_once(
              "tests/background-worker-monitoring.test.mjs",
              '''  jobExecutionConfiguration,
            jobFailureDisposition,
          ''',
              '''  jobExecutionConfiguration,
            jobFailureDisposition,
            refreshJobLease,
          ''',
          )

          replace_once(
              "tests/background-worker-monitoring.test.mjs",
              '''test("scan execution timeout and stale-lock windows cannot overlap", () => {
            assert.deepEqual(jobExecutionConfiguration({}), {
              timeoutSeconds: 1_200,
              staleSeconds: 1_500,
            });
            assert.deepEqual(jobExecutionConfiguration({
              BACKGROUND_JOB_TIMEOUT_SECONDS: "480",
              BACKGROUND_JOB_STALE_SECONDS: "600",
            }), {
              timeoutSeconds: 1_200,
              staleSeconds: 1_500,
            });
          });
          ''',
              '''test("long scan timeout is independent from the heartbeat lease", () => {
            assert.deepEqual(jobExecutionConfiguration({}), {
              timeoutSeconds: 1_200,
              heartbeatSeconds: 15,
              staleSeconds: 90,
            });
            assert.deepEqual(jobExecutionConfiguration({
              BACKGROUND_JOB_TIMEOUT_SECONDS: "1800",
              BACKGROUND_JOB_HEARTBEAT_SECONDS: "20",
              BACKGROUND_JOB_LEASE_STALE_SECONDS: "120",
            }), {
              timeoutSeconds: 1_800,
              heartbeatSeconds: 20,
              staleSeconds: 120,
            });
          });

          test("job lease heartbeat only refreshes a still-owned running job", async () => {
            let query = "";
            const sql = async (strings) => {
              query = strings.join("?").replace(/\\s+/gu, " ").trim();
              return [{ id: "job_owned" }];
            };
            assert.equal(await refreshJobLease(sql, "job_owned", "worker_owned"), true);
            assert.match(query, /UPDATE background_jobs SET locked_at = now\\(\\)/u);
            assert.match(query, /status = 'running'/u);
            assert.match(query, /locked_by = \\?/u);
          });
          ''',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate focused recovery tests
        run: |
          node --test tests/background-worker-monitoring.test.mjs tests/scan-pipeline-architecture.test.mjs

      - name: Validate full source suite
        run: |
          npm run build
          npm run lint
          npm test

      - name: Commit recovery fix to feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/server/scan-workflow.ts app/api/internal/jobs/'[jobId]'/execute/route.ts scripts/background-worker.mjs deploy/vps.env.example tests/scan-pipeline-architecture.test.mjs tests/background-worker-monitoring.test.mjs
          git diff --cached --check
          git commit -m 'Recover orphaned scan jobs safely'
          git push origin HEAD:feature/reddit-intelligence-pipeline
