name: Apply TVCP zero-result resilience fix

on:
  push:
    branches:
      - diagnostic/runtime-queue-20260814
    paths:
      - .github/workflows/apply-tvcp-zero-result-fix.yml
      - .github/scripts/apply-tvcp-zero-result-fix.py
      - .github/scripts/patch-tvcp-architecture-test.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/runtime-queue-20260814
          fetch-depth: 0

      - name: Preserve patch scripts
        run: |
          cp .github/scripts/apply-tvcp-zero-result-fix.py /tmp/apply-tvcp-zero-result-fix.py
          cp .github/scripts/patch-tvcp-architecture-test.py /tmp/patch-tvcp-architecture-test.py

      - name: Check out feature branch
        run: |
          git fetch origin feature/reddit-intelligence-pipeline
          git checkout -B feature/reddit-intelligence-pipeline origin/feature/reddit-intelligence-pipeline

      - name: Apply bounded false-zero fix and internal diagnostics
        run: |
          python3 /tmp/apply-tvcp-zero-result-fix.py
          python3 /tmp/patch-tvcp-architecture-test.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: node --test tests/reddit-intelligence-pipeline.test.mjs tests/scan-pipeline-architecture.test.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Full tests
        run: npm test

      - name: Commit feature branch fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/intelligence/reddit-pipeline.ts lib/server/scan-workflow.ts lib/server/contracts.ts tests/reddit-intelligence-pipeline.test.mjs tests/scan-pipeline-architecture.test.mjs app/api/internal/diagnostics/recent-scans/route.ts
          git commit -m 'Harden zero-result audits against triage false negatives'
          git push origin HEAD:feature/reddit-intelligence-pipeline
