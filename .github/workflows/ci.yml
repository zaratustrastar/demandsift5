name: CI

on:
  push:
    branches:
      - main
      - feature/reddit-intelligence-pipeline
  pull_request:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application for server-rendered tests
        run: npm run build

      - name: Run source-level test suite
        run: node --test tests/*.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release wrapper syntax
        run: bash -n deploy/demandsift-release

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test


  apify-search-semantics-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/reddit-intelligence-pipeline'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Check out probe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Run bounded real-data search probe
        run: node scripts/acceptance-apify-search-probe.mjs
