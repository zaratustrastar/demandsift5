name: CI

# Feature changes are validated through this PR workflow before VPS deployment.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: demandsift-ci-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a Docker release build on the small self-hosted VPS. A
  # cancelled legacy build can retain its intermediate container and exhaust
  # disk. The feature-tip guard below still prevents a queued stale candidate
  # from being deployed.
  cancel-in-progress: false

jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application for server-rendered tests
        run: npm run build

      - name: Run source-level test suite
        run: node --test tests/*.test.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release wrapper syntax
        run: bash -n deploy/demandsift-release

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  candidate-deploy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/reddit-intelligence-pipeline'
    needs:
      - source-tests
      - verify
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Reclaim runner-owned caches before the Docker build
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$HOME/.npm/_cacache" "$HOME/.cache"
          find "$HOME/actions-runner/_diag" -type f -mtime +2 -delete 2>/dev/null || true
          find "$HOME/actions-runner/_work/_temp" -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf -- {} + 2>/dev/null || true
          df -h /

      - name: Build tested candidate images
        run: sudo -n /usr/local/sbin/demandsift-release build "$EXPECTED_SHA"

      - name: Confirm candidate is still the feature tip
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote https://github.com/zaratustrastar/demandsift5.git refs/heads/feature/reddit-intelligence-pipeline | awk '{print $1}')"
          test -n "$remote_sha"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "Feature branch advanced during the Docker build; refusing stale deployment." >&2
            exit 1
          fi

      - name: Deploy candidate with rollback preserved
        run: sudo -n /usr/local/sbin/demandsift-release deploy

      - name: Verify healthy release
        run: sudo -n /usr/local/sbin/demandsift-release inspect

  acceptance-basecamp:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/reddit-intelligence-pipeline'
    needs:
      - candidate-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: https://demandsift.143-244-154-139.sslip.io
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Confirm deployed candidate is still current
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote https://github.com/zaratustrastar/demandsift5.git refs/heads/feature/reddit-intelligence-pipeline | awk '{print $1}')"
          test -n "$remote_sha"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "Feature branch advanced after deployment; skipping stale acceptance scan."
            exit 78
          fi

      - name: Run one controlled Basecamp scan against production
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cookie_jar="$(mktemp)"
          created_json="$(mktemp)"
          latest_json="$(mktemp)"
          diagnostics_json="$(mktemp)"
          trap 'rm -f "$cookie_jar" "$created_json" "$latest_json" "$diagnostics_json"' EXIT

          curl --fail-with-body --silent --show-error \
            --cookie-jar "$cookie_jar" \
            -H 'content-type: application/json' \
            -X POST \
            --data '{"websiteUrl":"https://basecamp.com","defer":true}' \
            "$APP_URL/api/scans" > "$created_json"

          scan_id="$(python3 - "$created_json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          scan = payload.get("scan") or {}
          print(scan.get("id") or "")
          PY
          )"
          test -n "$scan_id"
          echo "acceptance_scan_id=$scan_id"

          queued_polls=0
          running_polls=0
          for attempt in $(seq 1 150); do
            curl --fail-with-body --silent --show-error \
              --cookie "$cookie_jar" \
              "$APP_URL/api/scans/$scan_id" > "$latest_json"

            status="$(python3 - "$latest_json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          print((payload.get("scan") or {}).get("status") or "")
          PY
          )"
            if [ "$status" = "queued" ]; then queued_polls=$((queued_polls + 1)); fi
            if [ "$status" = "running" ]; then running_polls=$((running_polls + 1)); fi
            echo "acceptance_poll=$attempt status=$status queued_polls=$queued_polls running_polls=$running_polls"

            if [ "$status" = "complete" ]; then
              curl --fail-with-body --silent --show-error \
                --cookie "$cookie_jar" \
                "$APP_URL/acceptance-diagnostics" > "$diagnostics_json"
              python3 - "$latest_json" "$diagnostics_json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          aggregate = json.load(open(sys.argv[2]))
          report = payload.get("report") or {}
          scan = payload.get("scan") or {}
          stored = report.get("storedCounts") or {}
          potential = report.get("potentialCustomers") or {}
          output = aggregate.get("output") or {}
          diagnostics = aggregate.get("diagnostics") or {}
          retrieval = aggregate.get("retrieval") or {}
          decisions = aggregate.get("decisionBreakdown") or {}
          enrichment_failure = str(diagnostics.get("enrichmentFailureReason") or "").lower()
          if not enrichment_failure:
              enrichment_failure_category = "none"
          elif "timed out" in enrichment_failure or "timeout" in enrichment_failure:
              enrichment_failure_category = "actor_timeout"
          elif "mapping_failure" in enrichment_failure:
              enrichment_failure_category = "actor_mapping_failure"
          elif "http" in enrichment_failure:
              enrichment_failure_category = "actor_http_error"
          else:
              enrichment_failure_category = "actor_error"
          print("acceptance_result=complete")
          print("website=" + str(scan.get("websiteUrl") or ""))
          print("data_mode=" + str(report.get("dataMode") or ""))
          print("opportunities=" + str(len(report.get("opportunities") or [])))
          print("potential_customers=" + str(potential.get("total") or 0))
          print("insights=" + str(len(report.get("insights") or [])))
          print("replies=" + str(len(report.get("replies") or [])))
          print("stored_opportunities=" + str(stored.get("opportunities") or 0))
          print("stored_insights=" + str(stored.get("insights") or 0))
          print("stored_competitor_signals=" + str(stored.get("competitorSignals") or 0))
          print("stored_replies=" + str(stored.get("replies") or 0))
          safe_funnel = {
              "retrieved": diagnostics.get("retrieved", 0),
              "normalized": diagnostics.get("normalized", 0),
              "deterministicSurvivors": diagnostics.get("deterministicSurvivors", 0),
              "submittedForTriage": diagnostics.get("submittedForTriage", 0),
              "triageReturned": diagnostics.get("triageReturned", 0),
              "worthEnriching": diagnostics.get("worthEnriching", 0),
              "requestedForEnrichment": diagnostics.get("requestedForEnrichment", 0),
              "enrichedSuccessfully": diagnostics.get("enrichedSuccessfully", 0),
              "enrichmentFailures": diagnostics.get("enrichmentFailures", 0),
              "enrichmentFailureCategory": enrichment_failure_category,
              "submittedForDeepQualification": diagnostics.get("submittedForDeepQualification", 0),
              "deepQualificationsReturned": diagnostics.get("deepQualificationsReturned", 0),
              "potentialCustomerConversations": diagnostics.get("potentialCustomerConversations", 0),
              "uniquePotentialCustomers": diagnostics.get("uniquePotentialCustomers", 0),
              "repliesGenerated": diagnostics.get("repliesGenerated", 0),
              "queryCount": retrieval.get("queryCount", 0),
              "queryCountsByLane": retrieval.get("queryCountsByLane", {}),
              "matchedCandidatesByLane": retrieval.get("matchedCandidatesByLane", {}),
              "worthEnrichingByLane": retrieval.get("worthEnrichingByLane", {}),
          }
          print("acceptance_funnel=" + json.dumps(safe_funnel, separators=(",", ":"), sort_keys=True))
          print("acceptance_triage_breakdown=" + json.dumps(decisions.get("triage") or {}, separators=(",", ":"), sort_keys=True))
          print("acceptance_deep_breakdown=" + json.dumps(decisions.get("deepQualification") or {}, separators=(",", ":"), sort_keys=True))
          if int(output.get("potentialCustomers") or 0) < 1:
              raise SystemExit("Acceptance failed: no qualified potential customer was stored.")
          if int(output.get("replies") or 0) < 1:
              raise SystemExit("Acceptance failed: no grounded suggested reply was stored.")
          PY
              exit 0
            fi

            if [ "$status" = "failed" ]; then
              python3 - "$latest_json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          scan = payload.get("scan") or {}
          error = payload.get("error") or {}
          print("acceptance_result=failed")
          print("scan_error=" + str(scan.get("error") or ""))
          print("api_error_code=" + str(error.get("code") or ""))
          print("api_error_message=" + str(error.get("message") or ""))
          print("progress=" + json.dumps([
              {"id": x.get("id"), "status": x.get("status")}
              for x in (scan.get("progress") or [])
          ], separators=(",", ":")))
          PY
              exit 1
            fi

            sleep 10
          done

          echo "acceptance_result=timeout" >&2
          exit 1
