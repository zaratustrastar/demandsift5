name: Deploy validated TVCP repair

on:
  push:
    branches:
      - feature-staging-tvcp-diagnostics-20260816
    paths:
      - .github/workflows/deploy-current-tvcp-repair.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    env:
      EXPECTED_SHA: b06f281edcc9b6d7e778cdc7c9062d70c15d4afa
    steps:
      - name: Confirm tested feature tip
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote https://github.com/zaratustrastar/demandsift5.git refs/heads/feature/reddit-intelligence-pipeline | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
      - name: Build exact tested repair
        run: sudo -n /usr/local/sbin/demandsift-release build "$EXPECTED_SHA"
      - name: Reconfirm feature tip and deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote https://github.com/zaratustrastar/demandsift5.git refs/heads/feature/reddit-intelligence-pipeline | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
          sudo -n /usr/local/sbin/demandsift-release deploy
          sudo -n /usr/local/sbin/demandsift-release inspect
