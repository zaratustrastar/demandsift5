name: Diagnose Apify 402

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect sanitized Apify billing response from worker
        shell: bash
        run: |
          set -Eeuo pipefail
          script='const token=process.env.APIFY_TOKEN||""; const rawActor=process.env.APIFY_REDDIT_ACTOR_ID||""; if(!token||!rawActor){console.error("missing_apify_runtime_config");process.exit(2)} const actor=rawActor.replace("/","~"); console.log("actor_id="+actor); const headers={Authorization:`Bearer ${token}`,"Content-Type":"application/json"}; async function body(r){const t=await r.text();try{return JSON.parse(t)}catch{return {raw:t.slice(0,1000)}}} (async()=>{ let r=await fetch(`https://api.apify.com/v2/acts/${encodeURIComponent(actor)}`,{headers}); let p=await body(r); console.log("actor_metadata_http="+r.status); const d=p.data||{}; console.log("actor_metadata="+JSON.stringify({id:d.id,name:d.name,username:d.username,pricingInfos:d.pricingInfos,isDeprecated:d.isDeprecated}).slice(0,4000)); const input={searches:["looking for project management software"],ignoreStartUrls:true,skipComments:true,skipUserPosts:true,skipCommunity:true,includeMediaLinks:false,searchPosts:true,searchComments:true,searchCommunities:false,searchUsers:false,searchMedia:false,sort:"relevance",time:"week",includeNSFW:false,maxItems:1,maxPostCount:1,maxComments:0,maxCommunitiesCount:0,maxUserCount:0,scrollTimeout:20,navigationTimeout:30,debugMode:false,proxy:{useApifyProxy:true,apifyProxyGroups:["RESIDENTIAL"]}}; r=await fetch(`https://api.apify.com/v2/acts/${encodeURIComponent(actor)}/runs?waitForFinish=1&timeout=30&maxItems=1&maxTotalChargeUsd=0.50`,{method:"POST",headers,body:JSON.stringify(input)}); p=await body(r); console.log("test_run_http="+r.status); const x=p.data||{}; const err=p.error?{type:p.error.type,message:p.error.message}:undefined; console.log("test_run="+JSON.stringify({id:x.id,status:x.status,statusMessage:x.statusMessage,usageTotalUsd:x.usageTotalUsd,pricingInfo:x.pricingInfo,error:err}).slice(0,4000)); })().catch(e=>{console.error("diagnostic_error="+(e&&e.message?e.message:String(e)));process.exit(1)})'

          if docker exec demandsift2-worker-1 node -e "$script"; then
            exit 0
          fi
          sudo -n /usr/bin/docker exec demandsift2-worker-1 node -e "$script"
