name: Fix runtime recovery patcher

on:
  push:
    branches:
      - diagnostic/runtime-queue-20260814
    paths:
      - .github/workflows/fix-runtime-patcher.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/runtime-queue-20260814
      - name: Fix regex replacement handling
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-runtime-queue-recovery-v2.yml')
          text = p.read_text()
          old = 'updated, n = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'updated, n = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if text.count(old) != 1:
              raise SystemExit('expected one patcher helper match')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-runtime-queue-recovery-v2.yml
          git commit -m 'Fix regex replacement escaping'
          git push origin HEAD:diagnostic/runtime-queue-20260814
