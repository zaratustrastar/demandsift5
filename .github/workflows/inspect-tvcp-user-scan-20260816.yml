name: Inspect TVCP user scan history

on:
  push:
    branches:
      - diagnose-tvcp-user-scan-20260816
    paths:
      - .github/workflows/inspect-tvcp-user-scan-20260816.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect safe privileged diagnostic permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n -l || true
          echo '--- installed wrapper diagnostic implementation ---'
          sed -n '115,170p' /usr/local/sbin/demandsift-release || true
          echo '--- source checkout wrapper metadata ---'
          stat -c '%A %U:%G %n' /opt/demandsift5-pr1/deploy/demandsift-release 2>/dev/null || true
          stat -c '%A %U:%G %n' /opt/demandsift5/deploy/demandsift-release 2>/dev/null || true
