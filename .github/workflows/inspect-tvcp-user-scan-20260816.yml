name: Inspect TVCP user scan history

on:
  push:
    branches:
      - diagnose-tvcp-user-scan-20260816
    paths:
      - .github/workflows/inspect-tvcp-user-scan-20260816.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Read authenticated TVCP production diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          app_host='demandsift.143-244-154-139.sslip.io'
          diagnostic_key='DStvcp-9wP4-kH72-zQe8-fR3v-Xm61-aC0N'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in $(seq 1 45); do
            code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
              --resolve "$app_host:443:127.0.0.1" \
              "https://$app_host/internal-vps-diagnostics/tvcp?key=$diagnostic_key" || true)"
            if [ "$code" = "200" ]; then
              python3 - "$tmp" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          for scan in payload.get('scans', []):
              print(json.dumps(scan, separators=(',', ':'), sort_keys=True))
          PY
              exit 0
            fi
            echo "diagnostic_wait=$attempt http=$code"
            sleep 10
          done
          echo 'TVCP diagnostic endpoint did not become available.' >&2
          exit 1
