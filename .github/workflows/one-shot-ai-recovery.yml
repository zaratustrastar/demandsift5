name: One-shot publish AI recovery patch

on:
  push:
    branches: [feature/reddit-intelligence-pipeline]
    paths:
      - .github/workflows/one-shot-ai-recovery.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 1
          persist-credentials: true
      - name: Apply tested patch and publish branch
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/fix.patch"
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"
          git diff --check
          # Focused regression ran locally; the main CI job runs the complete Linux suite.
          git config user.name "DemandSift CI"
          git config user.email "actions@demandsift.local"
          git add lib/providers/openai.server.ts tests/openai-intelligence-pipeline.test.mjs
          git commit -m "Recover length-limited structured AI responses"
          git push origin HEAD:feature/reddit-intelligence-pipeline
