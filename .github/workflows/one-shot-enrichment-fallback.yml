name: One-shot enrichment fallback publisher

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/one-shot-enrichment-fallback.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Apply verified fallback patch
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 -d > /tmp/enrichment-fallback.patch <<'PATCH'

PATCH
          git apply --check /tmp/enrichment-fallback.patch
          git apply /tmp/enrichment-fallback.patch
      - run: npm ci
      - name: Run focused regression tests
        run: node --test tests/apify-reddit-provider.test.mjs tests/scan-pipeline-architecture.test.mjs
      - name: Commit verified change
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DemandSift CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/providers/reddit.server.ts lib/server/scan-workflow.ts tests/apify-reddit-provider.test.mjs tests/scan-pipeline-architecture.test.mjs
          git commit -m "Degrade safely when Reddit enrichment fails"
          git push origin HEAD:feature/reddit-intelligence-pipeline

# one-shot trigger
