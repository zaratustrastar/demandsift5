name: One-shot enrichment observability

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/one-shot-enrichment-observability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Add safe enrichment failure diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = Path(path).read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              Path(path).write_text(text.replace(old, new, 1))

          replace_once(
              "lib/providers/contracts.ts",
              '''  diagnostics: {\n    requested: number;\n    enriched: number;\n    failed: number;\n    fallbackUsed: number;\n  };''',
              '''  diagnostics: {\n    requested: number;\n    enriched: number;\n    failed: number;\n    fallbackUsed: number;\n    /** Sanitized provider/mapping reason; never contains credentials or raw Reddit content. */\n    failureReason?: string;\n  };''',
          )

          replace_once(
              "lib/providers/reddit.server.ts",
              '''    let payload: unknown[];\n    try {\n      payload = await this.runActor(input);\n    } catch (error) {\n      console.error("Apify Reddit thread enrichment failed", error);\n      return {\n        conversations: [],\n        sourceMode: this.sourceMode,\n        diagnostics: {\n          requested: candidates.length,\n          enriched: 0,\n          failed: candidates.length,\n          fallbackUsed: 0,\n        },\n      };\n    }\n\n    let failed = 0;\n    const conversations = candidates.flatMap((candidate) => {\n      const enriched = enrichedItemForCandidate(candidate, payload);\n      if (!enriched) {\n        failed += 1;\n        return [];\n      }\n      const conversation = enrichedConversation(candidate, enriched, payload, `apify:${this.actorId}`);\n      if (!conversation) {\n        failed += 1;\n        return [];\n      }\n      return [conversation];\n    });\n    return {\n      conversations,\n      sourceMode: this.sourceMode,\n      diagnostics: {\n        requested: candidates.length,\n        enriched: conversations.length,\n        failed,\n        fallbackUsed: 0,\n      },\n    };''',
              '''    let payload: unknown[];\n    try {\n      payload = await this.runActor(input);\n    } catch (error) {\n      console.error("Apify Reddit thread enrichment failed", error);\n      const message = error instanceof Error ? error.message : "Unknown Apify enrichment failure.";\n      return {\n        conversations: [],\n        sourceMode: this.sourceMode,\n        diagnostics: {\n          requested: candidates.length,\n          enriched: 0,\n          failed: candidates.length,\n          fallbackUsed: 0,\n          failureReason: `actor_error:${message.slice(0, 500)}`,\n        },\n      };\n    }\n\n    let failed = 0;\n    let unmatched = 0;\n    let invalidConversation = 0;\n    const conversations = candidates.flatMap((candidate) => {\n      const enriched = enrichedItemForCandidate(candidate, payload);\n      if (!enriched) {\n        failed += 1;\n        unmatched += 1;\n        return [];\n      }\n      const conversation = enrichedConversation(candidate, enriched, payload, `apify:${this.actorId}`);\n      if (!conversation) {\n        failed += 1;\n        invalidConversation += 1;\n        return [];\n      }\n      return [conversation];\n    });\n    return {\n      conversations,\n      sourceMode: this.sourceMode,\n      diagnostics: {\n        requested: candidates.length,\n        enriched: conversations.length,\n        failed,\n        fallbackUsed: 0,\n        ...(failed > 0\n          ? {\n              failureReason:\n                `actor_succeeded_mapping_failure:unmatched=${unmatched};invalid=${invalidConversation};payload_items=${payload.length}`,\n            }\n          : {}),\n      },\n    };''',
          )

          replace_once(
              "lib/server/scan-workflow.ts",
              '''      throw new ApiError(\n        `Reddit enrichment failed: selected ${selectedForEnrichment.length}, enriched 0, failed ${failed}.`,\n        502,\n        "reddit_enrichment_failed",\n      );''',
              '''      const technicalReason = enrichment.diagnostics.failureReason\n        ? ` Technical reason: ${enrichment.diagnostics.failureReason}`\n        : "";\n      throw new ApiError(\n        `Reddit enrichment failed: selected ${selectedForEnrichment.length}, enriched 0, failed ${failed}.${technicalReason}`,\n        502,\n        "reddit_enrichment_failed",\n      );''',
          )

          replace_once(
              "tests/apify-reddit-provider.test.mjs",
              '''  assert.equal(result.diagnostics.failed, 1);\n});\n\ntest("controlled live enrichment probe opens and maps one selected thread", {''',
              '''  assert.equal(result.diagnostics.failed, 1);\n  assert.match(result.diagnostics.failureReason, /^actor_error:.*HTTP 503/i);\n});\n\ntest("enrichment reports actor-success mapping failures without inventing context", async () => {\n  const provider = new redditModule.ApifyRedditTestProvider({\n    actorId: "trudax/reddit-scraper-lite",\n    token: "private-apify-token",\n    fetchImpl: async (url) => {\n      const parsedUrl = new URL(url);\n      if (parsedUrl.pathname.includes("/actors/") && parsedUrl.pathname.endsWith("/runs")) {\n        return new Response(JSON.stringify({\n          data: {\n            id: "run-mapping-failure",\n            status: "SUCCEEDED",\n            defaultDatasetId: "dataset-mapping-failure",\n          },\n        }), { status: 201 });\n      }\n      if (parsedUrl.pathname.includes("/datasets/dataset-mapping-failure/items")) {\n        return new Response(JSON.stringify([{\n          ...documentedActorItem,\n          id: "t3_different",\n          parsedId: "different",\n          url: "https://www.reddit.com/r/SaaS/comments/different/different_thread/",\n        }]), { status: 200 });\n      }\n      throw new Error(`Unexpected mocked Apify URL: ${parsedUrl}`);\n    },\n  });\n\n  const candidate = {\n    provider: "apify-test",\n    sourceMode: "apify-test",\n    externalId: "abc123",\n    kind: "post",\n    subreddit: "SaaS",\n    title: documentedActorItem.title,\n    body: documentedActorItem.body,\n    author: documentedActorItem.username,\n    permalink: documentedActorItem.url,\n    createdAt: documentedActorItem.createdAt,\n    metrics: { score: 21, comments: 14 },\n    matchedQueries: ["demand intelligence recommendations"],\n    discoveryLanes: ["direct_buying_intent"],\n    provenance: {\n      id: "reddit_apify_abc123",\n      kind: "reddit",\n      provider: "apify-test",\n      providerExternalId: "abc123",\n      url: documentedActorItem.url,\n      title: documentedActorItem.title,\n      excerpt: documentedActorItem.body.slice(0, 280),\n      contentHash: "hash-abc123",\n      observedAt: "2026-08-06T12:31:00.000Z",\n      isMock: false,\n      metadata: { testOnly: true },\n    },\n  };\n\n  const result = await provider.enrich({ candidates: [candidate] });\n  assert.deepEqual(result.conversations, []);\n  assert.equal(result.diagnostics.failed, 1);\n  assert.match(\n    result.diagnostics.failureReason,\n    /^actor_succeeded_mapping_failure:unmatched=1;invalid=0;payload_items=1$/,\n  );\n});\n\ntest("controlled live enrichment probe opens and maps one selected thread", {''',
          )
          PY

          git diff --check
          npm ci
          node --test tests/apify-reddit-provider.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/providers/contracts.ts lib/providers/reddit.server.ts lib/server/scan-workflow.ts tests/apify-reddit-provider.test.mjs
          git commit -m "Surface Reddit enrichment failure diagnostics"
          git push origin HEAD:feature/reddit-intelligence-pipeline
