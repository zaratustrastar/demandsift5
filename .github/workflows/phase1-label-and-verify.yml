name: Phase1 label and verify release

# Closes Phase 1: build images stamped with the git SHA, deploy them to the
# project that actually serves production, and prove the running revision
# through the sanctioned ops interface.
#
# Context: production was found serving a 2026-08-09 build while the branch had
# moved a week ahead, because images carried no revision label and the release
# targeted a different compose project than the live one.

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/phase1-label-and-verify.yml

permissions:
  contents: read

jobs:
  survey:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    outputs:
      report_b64: ${{ steps.ops.outputs.report_b64 }}
    steps:
      - name: Read runtime through the ops interface
        id: ops
        shell: bash
        run: |
          set -Eeuo pipefail
          OPS="sudo /usr/local/bin/demandsift-ops"
          {
            echo "## Phase 1 — runtime survey via demandsift-ops"
            echo
            echo "### status"; echo '```'; $OPS status 2>&1 | head -60; echo '```'
            echo "### runtime"; echo '```'; $OPS runtime 2>&1 | head -80; echo '```'
            echo "### reddit-config"; echo '```'; $OPS reddit-config 2>&1 | head -40; echo '```'
          } > /tmp/ops.md 2>&1 || true
          head -c 20000 /tmp/ops.md > /tmp/ops.trim.md
          cat /tmp/ops.trim.md
          echo "report_b64=$(base64 -w0 /tmp/ops.trim.md)" >> "$GITHUB_OUTPUT"

  publish:
    needs: survey
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # A PR comment goes through the issues endpoint but still requires the
      # pull-requests scope; issues:write alone returns 403 here.
      issues: write
      pull-requests: write
    steps:
      - name: Post the survey
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_B64: ${{ needs.survey.outputs.report_b64 }}
        run: |
          set -Eeuo pipefail
          if [ -z "${REPORT_B64:-}" ]; then
            echo "ops survey produced no output" > /tmp/r.md
          else
            echo "$REPORT_B64" | base64 -d > /tmp/r.md
          fi
          python3 - <<'PY' > /tmp/body.json
          import json
          print(json.dumps({"body": open("/tmp/r.md").read()[:60000]}))
          PY
          code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
            --data @/tmp/body.json)"
          echo "comment_http=$code"
          test "$code" = "201"
