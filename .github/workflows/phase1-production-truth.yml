name: Phase1 production truth check

# Runs ON the VPS via the self-hosted runner to establish what production is
# actually running, before any classifier or filter is touched.
#
# Secret hygiene: this posts to a public PR, so it never dumps vps.env. Only
# the named non-secret acquisition keys are echoed, and anything token-shaped
# is reduced to a presence/length report.

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/phase1-production-truth.yml

permissions:
  contents: read
  issues: write

jobs:
  truth:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    outputs:
      report_b64: ${{ steps.collect.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 1

      - name: Collect production truth
        id: collect
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/phase1.md

          # Resolve docker explicitly: the runner's non-login shell may not have
          # it on PATH even though the deploy workflow uses it via sudo.
          DOCKER=""
          for cand in /usr/bin/docker /usr/local/bin/docker "$(command -v docker || true)"; do
            [ -n "$cand" ] && [ -x "$cand" ] && DOCKER="$cand" && break
          done
          # Surface the real error instead of swallowing it: sudoers here may
          # grant NOPASSWD for specific binaries only, so `sudo -n true` can
          # fail while `sudo -n /usr/bin/docker` succeeds.
          d() { sudo -n "$DOCKER" "$@" 2>>/tmp/derr.log || "$DOCKER" "$@" 2>>/tmp/derr.log; }
          : > /tmp/derr.log
          echo "probe_sudo_docker: $(sudo -n "$DOCKER" ps --format '{{.Names}}' 2>&1 | head -3)" > /tmp/probe.txt
          echo "probe_plain_docker: $("$DOCKER" ps --format '{{.Names}}' 2>&1 | head -3)" >> /tmp/probe.txt
          echo "probe_sudo_cat: $(sudo -n cat /opt/demandsift5-pr1/deploy/vps.env 2>&1 | head -1 | cut -c1-40)" >> /tmp/probe.txt
          echo "whoami: $(whoami); groups: $(groups 2>/dev/null)" >> /tmp/probe.txt

          # Everything inside this block lands in the report; earlier versions
          # echoed some sections to stdout and silently lost them.
          {
            echo "## Phase 1 — what production is actually running"
            echo
            echo "branch head: \`$(git rev-parse HEAD)\`"
            echo "docker_binary=${DOCKER:-<not found>}"
            echo "sudo_noninteractive=$(sudo -n true 2>/dev/null && echo yes || echo no)"
            echo

            echo "### Access probes"
            echo '```'
            cat /tmp/probe.txt 2>/dev/null || echo "no probes"
            echo "--- docker stderr ---"
            head -c 800 /tmp/derr.log 2>/dev/null || true
            echo '```'

            echo "### Containers"
            echo '```'
            d ps --format '{{.Names}} | {{.Image}} | {{.Status}}' || echo "docker ps produced nothing"
            echo '```'

            names="$(d ps --format '{{.Names}}' | grep -Ei 'demandsift|web|worker' || true)"
            echo "matched_containers=${names:-<none>}"

            echo "### Deployed SHA and code-presence per container"
            echo '```'
            for name in $names; do
              echo "--- $name"
              echo "label_revision=$(d inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$name" || echo '<none>')"
              echo "created=$(d inspect -f '{{.Created}}' "$name" || echo '<none>')"
              for marker in CONCEPT_SYNONYMS prioritizeCandidates conversationThemes discoveryProfile leadScore; do
                hit="$(d exec "$name" sh -lc "grep -rl '$marker' /app 2>/dev/null | head -2 | tr '\n' ' '" || true)"
                echo "  $marker -> ${hit:-<absent>}"
              done
            done
            echo '```'

            echo "### VPS deploy env (acquisition keys only)"
            echo '```'
            ENVFILE=/opt/demandsift5-pr1/deploy/vps.env
            if sudo -n test -f "$ENVFILE" 2>/dev/null; then
              echo "env_file=$ENVFILE present"
              for key in APIFY_REDDIT_ACTOR_ID APIFY_REDDIT_MAX_RESULTS \
                         APIFY_REDDIT_ENRICHMENT_LIMIT APIFY_REDDIT_ENRICHMENT_COMMENTS \
                         APIFY_REDDIT_TIME_RANGE REDDIT_ACQUISITION_CANDIDATES \
                         REDDIT_TRIAGE_BUDGET REDDIT_ENRICHMENT_BUDGET \
                         BACKGROUND_WORKER_MODE APP_RUNTIME_ENV; do
                echo "$(sudo -n grep -E "^${key}=" "$ENVFILE" 2>/dev/null | tail -1 || echo "${key}=<unset>")"
              done
              # Secrets: presence only, never values.
              for key in APIFY_TOKEN OPENAI_API_KEY DATABASE_URL; do
                v="$(sudo -n grep -E "^${key}=" "$ENVFILE" 2>/dev/null | tail -1 | cut -d= -f2- || true)"
                if [ -n "$v" ]; then echo "${key}=<set, ${#v} chars>"; else echo "${key}=<unset>"; fi
              done
            else
              echo "env_file=$ENVFILE NOT READABLE by the runner"
              echo "ls /opt:"; sudo -n ls -1 /opt 2>/dev/null || ls -1 /opt 2>/dev/null || echo "  <no access>"
            fi
            echo '```'

            echo "### Effective env inside containers"
            echo '```'
            for name in $names; do
              echo "--- $name"
              d exec "$name" sh -lc 'for k in APIFY_REDDIT_ACTOR_ID APIFY_REDDIT_MAX_RESULTS APIFY_REDDIT_ENRICHMENT_LIMIT APIFY_REDDIT_ENRICHMENT_COMMENTS APIFY_REDDIT_TIME_RANGE REDDIT_ACQUISITION_CANDIDATES REDDIT_TRIAGE_BUDGET BACKGROUND_WORKER_MODE; do echo "$k=$(printenv "$k" || echo "<unset>")"; done' || echo "exec unavailable"
            done
            echo '```'
          } > "$OUT" 2>&1

          head -c 20000 "$OUT" > /tmp/phase1.trimmed.md
          cat /tmp/phase1.trimmed.md
          echo "report_b64=$(base64 -w0 /tmp/phase1.trimmed.md)" >> "$GITHUB_OUTPUT"

  publish:
    needs: truth
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post findings to the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_B64: ${{ needs.truth.outputs.report_b64 }}
        run: |
          set -Eeuo pipefail
          if [ -z "${REPORT_B64:-}" ]; then
            echo "collection produced no report" > /tmp/phase1.md
          else
            echo "$REPORT_B64" | base64 -d > /tmp/phase1.md
          fi
          python3 - <<'PY' > /tmp/body.json
          import json
          print(json.dumps({"body": open("/tmp/phase1.md").read()[:60000]}))
          PY
          code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
            --data @/tmp/body.json)"
          echo "comment_http=$code"
          head -c 300 /tmp/resp.json || true
          test "$code" = "201"
