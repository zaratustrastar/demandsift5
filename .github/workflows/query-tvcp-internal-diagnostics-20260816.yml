name: Query TVCP internal diagnostics

on:
  push:
    branches:
      - diagnose-tvcp-user-scan-20260816
    paths:
      - .github/workflows/query-tvcp-internal-diagnostics-20260816.yml

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for temporary TVCP diagnostics and print sanitized history
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 90); do
            code="$(curl --silent --show-error --output /tmp/tvcp.json --write-out '%{http_code}' \
              -H 'X-VPS-Diagnostic-Key: tvcp-20260816-6e6ad7887f1d4ba7a7f5d84b7c1dd95e' \
              https://demandsift.143-244-154-139.sslip.io/internal-vps-diagnostics/tvcp || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/tvcp.json
              exit 0
            fi
            echo "diagnostic_wait=$attempt http=$code"
            sleep 10
          done
          echo 'TVCP diagnostics did not become available in time.' >&2
          exit 1
