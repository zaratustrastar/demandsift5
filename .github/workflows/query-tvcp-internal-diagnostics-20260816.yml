name: Query TVCP internal diagnostics

on:
  push:
    branches:
      - diagnose-tvcp-user-scan-20260816
    paths:
      - .github/workflows/query-tvcp-internal-diagnostics-20260816.yml

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print compact sanitized TVCP scan diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'X-VPS-Diagnostic-Key: tvcp-20260816-6e6ad7887f1d4ba7a7f5d84b7c1dd95e' \
            https://demandsift.143-244-154-139.sslip.io/internal-vps-diagnostics/tvcp > /tmp/tvcp.json
          python3 - /tmp/tvcp.json <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          for scan in payload.get('scans', [])[:4]:
              print('SCAN', scan.get('id'), scan.get('status'), scan.get('createdAt'))
              print('PROFILE', json.dumps(scan.get('profile'), separators=(',',':')))
              print('SEARCH_PLAN', json.dumps(scan.get('searchPlan'), separators=(',',':')))
              print('LANE_COUNTS', json.dumps(scan.get('matchedCandidatesByLane'), separators=(',',':')))
              print('QUERY_COUNTS', json.dumps(scan.get('matchedCandidatesByQuery'), separators=(',',':')))
              print('OUTPUT', json.dumps(scan.get('output'), separators=(',',':')))
              print('DIAGNOSTICS', json.dumps(scan.get('diagnostics'), separators=(',',':')))
          PY
