name: Query TVCP internal diagnostics

on:
  push:
    branches:
      - diagnose-tvcp-user-scan-20260816
    paths:
      - .github/workflows/query-tvcp-internal-diagnostics-20260816.yml

permissions:
  contents: read

jobs:
  query:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Query loopback-only TVCP diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --resolve demandsift.143-244-154-139.sslip.io:443:127.0.0.1 \
            https://demandsift.143-244-154-139.sslip.io/internal-vps-diagnostics/tvcp
