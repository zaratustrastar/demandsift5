name: Repair TVCP scan reliability

on:
  push:
    branches:
      - fix-tvcp-scan-reliability-20260816
    paths:
      - .github/workflows/repair-tvcp-scan-reliability.yml
      - scripts/repair-tvcp-scan-reliability.py

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-tvcp-scan-reliability-20260816
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 scripts/repair-tvcp-scan-reliability.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: node --test tests/apify-reddit-provider.test.mjs tests/openai-intelligence-pipeline.test.mjs tests/browser-scan-polling-resilience.test.mjs tests/reddit-intelligence-pipeline.test.mjs
      - name: Build
        run: npm run build:node
      - name: Lint
        run: npm run lint
      - name: Commit validated repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/providers/reddit.server.ts lib/providers/openai.server.ts tests/apify-reddit-provider.test.mjs tests/openai-intelligence-pipeline.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'Harden TVCP Reddit recall and AI triage'
          git push origin HEAD:fix-tvcp-scan-reliability-20260816
