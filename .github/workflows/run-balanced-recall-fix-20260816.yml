name: Run balanced recall fix

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/run-balanced-recall-fix-20260816.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: python3 scripts/apply-balanced-recall-fix.py
      - run: npm ci
      - name: Focused provider regression
        run: node --test tests/apify-reddit-provider.test.mjs
      - name: Full validation
        run: |
          npm test
          npm run build
          npm run lint
      - name: Commit tested repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/providers/reddit.server.ts tests/apify-reddit-provider.test.mjs
          git diff --cached --check
          git commit -m 'Balance Reddit retrieval across search lanes'
          git push origin HEAD:feature/reddit-intelligence-pipeline
