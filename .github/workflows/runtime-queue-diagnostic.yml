name: Runtime queue diagnostic

on:
  push:
    branches:
      - diagnostic/runtime-queue-20260814
    paths:
      - .github/workflows/runtime-queue-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect production release without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for wrapper in /usr/local/sbin/demandsift-release /usr/local/bin/demandsift-release /opt/demandsift5/deploy/demandsift-release; do
            if [ -x "$wrapper" ]; then
              echo "release_wrapper=$wrapper"
              sudo -n "$wrapper" inspect
              exit 0
            fi
          done
          echo "release_wrapper=NOT_FOUND"
          exit 1
