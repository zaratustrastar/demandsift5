name: Runtime queue diagnostic

on:
  push:
    branches:
      - diagnostic/runtime-queue-20260814
    paths:
      - .github/workflows/runtime-queue-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect production runtime without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "--- release ---"
          sudo -n /usr/local/sbin/demandsift-release inspect
          echo "--- acceptance scan ---"
          sudo -n /usr/local/sbin/demandsift-release scan-status scan_9bcf38220d114ff8aec77fd22a3271e4 || true
          echo "--- runner visibility ---"
          stat -c 'env_mode=%a env_owner=%U env_group=%G' /opt/demandsift5/deploy/vps.env 2>/dev/null || true
          if [ -r /opt/demandsift5/deploy/vps.env ]; then echo 'env_readable=true'; else echo 'env_readable=false'; fi
          ps -eo pid,ppid,etime,stat,comm,args | grep -E 'background-worker|server\.js|node' | grep -v grep | head -n 40 || true
          echo "--- local health ---"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1/ >/dev/null && echo 'local_http=ok' || echo 'local_http=failed'
