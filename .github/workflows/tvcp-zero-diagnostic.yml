name: Apply triage reliability hardening

on:
  push:
    branches:
      - diagnostic/tvcp-zero-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply triage batching and timeout fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin diagnostic/tvcp-zero-20260814
          git show origin/diagnostic/tvcp-zero-20260814:tools/triage-reliability-patch.py > /tmp/triage-reliability-patch.py
          python3 /tmp/triage-reliability-patch.py

      - name: Validate focused and full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --test tests/openai-intelligence-pipeline.test.mjs
          npm run lint
          npm run build
          npm test
          git diff --check

      - name: Commit source fix to feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/providers/openai.server.ts tests/openai-intelligence-pipeline.test.mjs
          git commit -m 'Harden triage batching and timeout fallback'
          git push origin HEAD:feature/reddit-intelligence-pipeline
