name: Apply zero-result acquisition audit

on:
  push:
    branches:
      - diagnostic/tvcp-zero-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply bounded acquisition zero-result audit
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin diagnostic/tvcp-zero-20260814
          git show origin/diagnostic/tvcp-zero-20260814:tools/zero-result-audit-patch.py > /tmp/zero-result-audit-patch.py
          python3 /tmp/zero-result-audit-patch.py

      - name: Validate focused and full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --test tests/reddit-intelligence-pipeline.test.mjs tests/scan-pipeline-architecture.test.mjs
          npm run lint
          npm run build
          npm test
          git diff --check

      - name: Commit source fix to feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/intelligence/reddit-pipeline.ts lib/server/scan-workflow.ts tests/reddit-intelligence-pipeline.test.mjs tests/scan-pipeline-architecture.test.mjs
          git commit -m 'Audit acquisition false-zero demand signals'
          git push origin HEAD:feature/reddit-intelligence-pipeline
