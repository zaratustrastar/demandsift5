name: One-shot VPS read-only diagnostic

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect current DemandSift VPS state
        shell: bash
        run: |
          set -uo pipefail
          worktree=/opt/demandsift5-pr1

          redact() {
            sed -E               -e 's/(Authorization: Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/g'               -e 's/((api[_-]?key|token|password|secret)[=:][[:space:]]*)[^,[:space:]"]+/\1[REDACTED]/Ig'               -e 's/(sk-[A-Za-z0-9_-]{8})[A-Za-z0-9_-]+/\1[REDACTED]/g'               -e 's/(inf_[A-Za-z0-9_-]{6})[A-Za-z0-9_-]+/\1[REDACTED]/g'
          }

          echo "::group::Host and toolchain"
          date -u
          uname -a
          whoami
          node --version 2>/dev/null || true
          npm --version 2>/dev/null || true
          docker --version
          docker compose version
          echo "::endgroup::"

          echo "::group::Git and worktree state"
          test -d "${worktree}/.git" || { echo "Missing worktree: ${worktree}"; exit 1; }
          git -C "${worktree}" status --short --branch
          git -C "${worktree}" branch --verbose --verbose
          git -C "${worktree}" log -15 --oneline --decorate
          git -C "${worktree}" remote -v | redact
          git -C "${worktree}" diff --stat
          git -C "${worktree}" diff --name-only
          git -C "${worktree}" diff --check || true
          echo "::endgroup::"

          echo "::group::Project structure"
          find "${worktree}" -maxdepth 2 -type f             ! -path '*/.git/*'             ! -name '*.env'             ! -name 'vps.env'             ! -name '*.zip'             -printf '%P\n' | sort | head -300
          echo "::endgroup::"

          echo "::group::Reddit provider symbols"
          rg -n 'runActor|maxTotalChargeUsd|startUrls|ApifyEnrichmentActorInput|async enrich|reddit_enrichment_failed|searchPosts|searchComments'             "${worktree}/lib/providers/reddit.server.ts"             "${worktree}/lib/server/scan-workflow.ts"             "${worktree}/scripts/background-worker.mjs" || true
          echo "::endgroup::"

          echo "::group::Reddit provider implementation"
          sed -n '700,1060p' "${worktree}/lib/providers/reddit.server.ts"
          echo "::endgroup::"

          echo "::group::Scan enrichment failure handling"
          sed -n '630,720p' "${worktree}/lib/server/scan-workflow.ts"
          echo "::endgroup::"

          echo "::group::Background worker retry handling"
          sed -n '650,830p' "${worktree}/scripts/background-worker.mjs"
          echo "::endgroup::"

          echo "::group::Relevant regression tests"
          sed -n '200,360p' "${worktree}/tests/apify-reddit-provider.test.mjs"
          rg -n 'reddit_enrichment_failed|retry|non.?retry|executeScanJob|Invalid input|startUrls'             "${worktree}/tests" || true
          echo "::endgroup::"

          echo "::group::Deployment configuration without environment values"
          sed -n '1,280p' "${worktree}/deploy/compose.vps.yaml"
          find "${worktree}/deploy" -maxdepth 2 -type f ! -name '*.env' ! -name 'vps.env' -printf '%P\n' | sort
          echo "::endgroup::"

          echo "::group::Docker and service state"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          systemctl is-active docker 2>/dev/null || true
          systemctl list-units --type=service --state=running --no-pager 2>/dev/null             | grep -E 'docker|actions\.runner|caddy|postgres' || true
          ss -ltnp 2>/dev/null | sed -n '1,100p' | redact
          echo "::endgroup::"

          echo "::group::Container runtime health"
          docker exec demandsift2-web-1 node --version 2>/dev/null || true
          docker exec demandsift2-worker-1 node --version 2>/dev/null || true
          docker exec demandsift2-database-1 pg_isready 2>/dev/null || true
          curl -sS -o /dev/null -w 'local_http=%{http_code} total=%{time_total}s\n' http://127.0.0.1/ || true
          curl -sS -o /dev/null -w 'public_https=%{http_code} total=%{time_total}s\n' https://demandsift.143-244-154-139.sslip.io/ || true
          echo "::endgroup::"

          echo "::group::Relevant redacted application events"
          {
            docker logs --since 48h --tail 800 demandsift2-web-1 2>&1
            docker logs --since 48h --tail 800 demandsift2-worker-1 2>&1
          } | grep -E 'cN1l66hPsTTOj3PNV|8vc2hFrE1RMN9sXBV|reddit_enrichment_failed|Reddit enrichment|Apify Reddit|job_(claimed|failed|succeeded)|scan_already_running|Invalid input|fetch failed'             | redact | tail -400 || true
          echo "::endgroup::"
