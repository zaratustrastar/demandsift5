name: Preserve VPS source patch

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: write

jobs:
  preserve:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Copy tracked VPS source changes
        shell: bash
        run: |
          set -euo pipefail
          source_root=/opt/demandsift5-pr1
          files=(
            lib/domain/types.ts
            lib/providers/contracts.ts
            lib/providers/openai.server.ts
            lib/providers/reddit.server.ts
            lib/server/contracts.ts
            lib/server/scan-workflow.ts
            tests/apify-reddit-provider.test.mjs
          )
          for file in "${files[@]}"; do
            test -f "${source_root}/${file}"
            install -D -m 0644 "${source_root}/${file}" "${GITHUB_WORKSPACE}/${file}"
          done
          git diff --check
          git status --short -- "${files[@]}"

      - name: Commit preserved patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/domain/types.ts
            lib/providers/contracts.ts
            lib/providers/openai.server.ts
            lib/providers/reddit.server.ts
            lib/server/contracts.ts
            lib/server/scan-workflow.ts
            tests/apify-reddit-provider.test.mjs
          )
          git config user.name "DemandSift diagnostic runner"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No source changes to preserve."
            exit 0
          fi
          git commit -m "Preserve VPS Reddit intelligence patch"
          git push origin HEAD:feature/reddit-intelligence-pipeline
