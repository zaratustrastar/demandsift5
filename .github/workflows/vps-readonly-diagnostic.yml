name: One-shot VPS read-only diagnostic

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect unpublished DemandSift source patch
        shell: bash
        run: |
          set -euo pipefail
          worktree=/opt/demandsift5-pr1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="${worktree}"

          test -e "${worktree}/.git"
          echo "::group::Patch identity and validation"
          echo "HEAD=$(git -C "${worktree}" rev-parse HEAD)"
          git -C "${worktree}" status --short --branch
          git -C "${worktree}" diff --check
          echo "::endgroup::"

          echo "::group::Uncommitted application and provider patch"
          git -C "${worktree}" diff --no-ext-diff --unified=20 -- \
            lib/domain/types.ts \
            lib/providers/contracts.ts \
            lib/providers/openai.server.ts \
            lib/providers/reddit.server.ts \
            lib/server/contracts.ts \
            lib/server/scan-workflow.ts
          echo "::endgroup::"

          echo "::group::Uncommitted Apify regression tests"
          git -C "${worktree}" diff --no-ext-diff --unified=12 -- \
            tests/apify-reddit-provider.test.mjs
          echo "::endgroup::"

          echo "::group::Existing worker retry logic references"
          grep -n -E -C 12 \
            'executeScanJob|job_failed|maxAttempts|retry|scan\.run|setTimeout|next_attempt' \
            "${worktree}/scripts/background-worker.mjs" || true
          echo "::endgroup::"
