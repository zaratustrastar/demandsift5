name: Validate enrichment fix and run controlled probe

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  validate-and-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Set up project Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run focused lint and regressions
        shell: bash
        run: |
          set -euo pipefail
          npx eslint lib/providers/reddit.server.ts scripts/background-worker.mjs tests/apify-reddit-provider.test.mjs tests/background-worker-monitoring.test.mjs
          node --test tests/apify-reddit-provider.test.mjs
          node --test --test-name-pattern='reddit enrichment failure|transient executor failures' tests/background-worker-monitoring.test.mjs
          git diff --check

      - name: Run one sanitized live enrichment probe
        shell: bash
        run: |
          set -euo pipefail
          token_file=/home/demandsift-dev/actions-runner/.diagnostic-secrets/apify-token
          test -s "$token_file"
          cleanup() {
            rm -f "$token_file"
          }
          trap cleanup EXIT
          APIFY_TOKEN="$(<"$token_file")" \
            APIFY_LIVE_ENRICHMENT_PROBE=true \
            node --test --test-name-pattern='controlled live enrichment probe' tests/apify-reddit-provider.test.mjs
