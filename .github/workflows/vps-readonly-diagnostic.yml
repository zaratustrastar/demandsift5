name: VPS sanitized Apify diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Inspect diagnostic credential availability
        shell: bash
        run: |
          set -u
          echo "identity=$(id -un)"
          for path in \
            /home/demandsift-dev/actions-runner/.diagnostic-secrets \
            /home/demandsift-dev/actions-runner/.diagnostic-secrets/apify-token
          do
            if [ -e "$path" ]; then
              stat -c 'path=%n owner=%U group=%G mode=%a bytes=%s' "$path"
            else
              echo "path=$path absent"
            fi
          done
      - name: Inspect latest Apify actor run without exposing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          token_file=/home/demandsift-dev/actions-runner/.diagnostic-secrets/apify-token
          test -s "$token_file"
          token="$(tr -d '\r\n' < "$token_file")"
          umask 077
          runs_json="$(mktemp)"
          input_json="$(mktemp)"
          run_log="$(mktemp)"
          trap 'rm -f "$runs_json" "$input_json" "$run_log"' EXIT

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            "https://api.apify.com/v2/actor-runs?limit=8&desc=1" \
            > "$runs_json"

          latest_id="$(python3 - "$runs_json" <<'PY'
          import json, sys
          items = json.load(open(sys.argv[1])).get("data", {}).get("items", [])
          for item in items[:8]:
              print("RUN", item.get("id"), item.get("actId"), item.get("status"),
                    item.get("statusMessage", ""), item.get("startedAt"), file=sys.stderr)
          print(items[0].get("id", "") if items else "")
          PY
          )"
          test -n "$latest_id"

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            "https://api.apify.com/v2/actor-runs/$latest_id/input" \
            > "$input_json"
          python3 - "$input_json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          safe = {key: value.get(key) for key in (
              "startUrls", "maxItems", "maxPostCount", "maxComments",
              "skipComments", "ignoreStartUrls"
          ) if key in value}
          print("LATEST_INPUT", json.dumps(safe, separators=(",", ":")))
          PY

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $token" \
            "https://api.apify.com/v2/logs/$latest_id" \
            > "$run_log"
          echo "LATEST_LOG_RELEVANT"
          grep -Ei 'error|invalid input|found starturl|status message|dataset|finished' "$run_log" | tail -n 80 || true
