name: VPS read-only Docker permission preflight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect deployment identity and Docker access
        shell: bash
        run: |
          set -u
          echo "inspection=after-wrapper-install"
          echo "identity=$(id -un)"
          echo "groups=$(id -Gn)"
          echo "host=$(hostname)"

          for directory in /opt/demandsift5-pr1 /opt/demandsift5; do
            if [ -d "$directory" ]; then
              stat -c 'directory=%n owner=%U group=%G mode=%a' "$directory"
              git -C "$directory" status --short --branch 2>&1 || true
              git -C "$directory" log -1 --format='head=%H subject=%s' 2>&1 || true
            else
              echo "directory=$directory absent"
            fi
          done

          for env_file in /opt/demandsift5-pr1/deploy/vps.env /opt/demandsift5/deploy/vps.env; do
            if [ -e "$env_file" ]; then
              stat -c 'env_file=%n owner=%U group=%G mode=%a bytes=%s' "$env_file"
            fi
          done

          echo "docker_binary=$(command -v docker || true)"
          docker version --format 'docker_client={{.Client.Version}} server={{.Server.Version}}' 2>&1 || true
          docker ps --format 'container={{.Names}} status={{.Status}} project={{.Label "com.docker.compose.project"}} service={{.Label "com.docker.compose.service"}}' 2>&1 || true
          sudo -n -l 2>&1 || true

          for installed_file in /usr/local/sbin/demandsift-release /etc/sudoers.d/demandsift-release; do
            if [ -e "$installed_file" ]; then
              stat -c 'installed_file=%n owner=%U group=%G mode=%a bytes=%s' "$installed_file"
            else
              echo "installed_file=$installed_file absent"
            fi
          done
          sudo -n /usr/local/sbin/demandsift-release inspect 2>&1 || true
