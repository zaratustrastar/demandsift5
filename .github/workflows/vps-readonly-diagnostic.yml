name: Apply enrichment fix and run controlled probe

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: write

jobs:
  fix-and-probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 0

      - name: Apply reviewed engineering patch
        shell: bash
        env:
          ENGINEERING_PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$ENGINEERING_PATCH_B64" | base64 --decode > /tmp/demandsift-enrichment-fix.patch
          git apply --check /tmp/demandsift-enrichment-fix.patch
          git apply /tmp/demandsift-enrichment-fix.patch
          rm -f /tmp/demandsift-enrichment-fix.patch
          git diff --check

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run focused lint and regressions
        shell: bash
        run: |
          set -euo pipefail
          npx eslint lib/providers/reddit.server.ts scripts/background-worker.mjs tests/apify-reddit-provider.test.mjs tests/background-worker-monitoring.test.mjs
          node --test tests/apify-reddit-provider.test.mjs
          node --test --test-name-pattern='reddit enrichment failure|transient executor failures' tests/background-worker-monitoring.test.mjs
          git diff --check

      - name: Run one sanitized live enrichment probe
        shell: bash
        run: |
          set -euo pipefail
          token_file=/home/demandsift-dev/actions-runner/.diagnostic-secrets/apify-token
          test -s "$token_file"
          cleanup() {
            rm -f "$token_file"
          }
          trap cleanup EXIT
          APIFY_TOKEN="$(<"$token_file")" \
            APIFY_LIVE_ENRICHMENT_PROBE=true \
            node --test --test-name-pattern='controlled live enrichment probe' tests/apify-reddit-provider.test.mjs

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/providers/reddit.server.ts
            scripts/background-worker.mjs
            tests/apify-reddit-provider.test.mjs
            tests/background-worker-monitoring.test.mjs
          )
          git config user.name "DemandSift diagnostic runner"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m "Fix Apify enrichment floor and terminal retry"
          git push origin HEAD:feature/reddit-intelligence-pipeline
