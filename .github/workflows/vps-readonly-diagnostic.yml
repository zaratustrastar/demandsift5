name: One-shot VPS read-only diagnostic

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-readonly-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect narrow runner privileges
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un)"
          echo "runner_groups=$(id -Gn)"
          echo "sudo_noninteractive_status:"
          sudo -n -l 2>&1 | sed -E             -e 's#(Bearer|token|password|secret|api[_-]?key)([=: ]+)[^ ,]+#\1\2[REDACTED]#Ig'             -e 's#/(root|home)/[^ /]+#/\1/[REDACTED]#g' || true
          echo "env_permissions:"
          stat -c '%A %U:%G %n'             /opt/demandsift5-pr1/deploy/vps.env             /opt/demandsift5/deploy/vps.env 2>&1 || true
