name: VPS read-only scan diagnostic

on:
  push:
    branches:
      - diagnostic/vps-scan-state

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect sanitized scan and runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== host ==="
          hostname
          uptime
          df -h /
          free -h

          echo "=== containers ==="
          docker ps --format 'container={{.Names}} status={{.Status}} project={{.Label "com.docker.compose.project"}} service={{.Label "com.docker.compose.service"}}'

          echo "=== scan aggregate ==="
          sudo -n /usr/local/sbin/demandsift-release scan-status scan_6deef75d0b58478bb565f1bf75cfad27 || true

          echo "=== scan job ==="
          docker exec demandsift2-database-1 sh -c '
            exec psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"               --no-align --tuples-only --field-separator="|"
          ' <<'SQL'
          SELECT type, status, attempts, max_attempts,
                 COALESCE(error, ''),
                 COALESCE(to_char(run_at, 'YYYY-MM-DD"T"HH24:MI:SS"Z"'), ''),
                 COALESCE(to_char(locked_at, 'YYYY-MM-DD"T"HH24:MI:SS"Z"'), ''),
                 COALESCE(to_char(completed_at, 'YYYY-MM-DD"T"HH24:MI:SS"Z"'), '')
          FROM background_jobs
          WHERE payload ->> 'scanId' = 'scan_6deef75d0b58478bb565f1bf75cfad27';
          SQL

          echo "=== recent sanitized service events ==="
          docker logs --since 20m demandsift2-worker-1 2>&1             | sed -E 's/(Bearer|token|key|secret|password)[=: ][^ ,}"]+/\1=[REDACTED]/Ig'             | tail -n 80
          docker logs --since 20m demandsift2-web-1 2>&1             | sed -E 's/(Bearer|token|key|secret|password)[=: ][^ ,}"]+/\1=[REDACTED]/Ig'             | grep -E 'scan_|Reddit retrieval|OpenAI|error|failed|completed'             | tail -n 120 || true
