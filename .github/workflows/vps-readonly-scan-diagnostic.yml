name: VPS read-only scan diagnostic

on:
  pull_request:
    branches:
      - feature/reddit-intelligence-pipeline

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'codex/diagnose-scan-b198'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect sanitized runtime state after acceptance failure
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "inspection=post-acceptance-500"
          date -u
          uptime
          df -h /
          free -h
          sudo -n /usr/local/sbin/demandsift-release inspect
