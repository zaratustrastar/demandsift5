name: DemandSift trusted VPS release

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-release-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    outputs:
      log_b64: ${{ steps.release.outputs.log_b64 }}
    steps:
      - name: Check out verified feature head in isolated runner workspace
        uses: actions/checkout@v4
        with:
          ref: feature/reddit-intelligence-pipeline
          fetch-depth: 1

      - name: Build, migrate, deploy, and verify with rollback images
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          # Mirror everything to a log so the outcome is reportable even when
          # runner logs are not reachable.
          exec > >(tee /tmp/release.log) 2>&1
          SOURCE_CHECKOUT=/opt/demandsift5-pr1
          ENV_FILE="$SOURCE_CHECKOUT/deploy/vps.env"
          COMPOSE_FILE="$GITHUB_WORKSPACE/deploy/compose.vps.yaml"
          # The live site is served by the `demandsift2` compose project. This
          # previously said `demandsift`, so releases built a parallel stack
          # with its own images and volumes while production kept serving a
          # 2026-08-09 build. Using the real project name also means the
          # existing Postgres and Caddy volumes are reused, not recreated.
          PROJECT="${DEMANDSIFT_COMPOSE_PROJECT:-demandsift2}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          RELEASE_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Consumed by deploy/compose.vps.yaml build labels so the running
          # image can prove its own revision.
          export RELEASE_SHA RELEASE_BUILT_AT
          ROLLBACK_TAG="rollback-$(date -u +%Y%m%dT%H%M%SZ)"

          test -f "$ENV_FILE" || { echo "missing_deploy_env=true"; exit 2; }
          sudo -n true

          # The checked-out release is isolated from the preserved dirty VPS worktree.
          echo "release_sha=$RELEASE_SHA"
          echo "source_checkout_preserved=$SOURCE_CHECKOUT"
          echo "rollback_tag=$ROLLBACK_TAG"

          ln -s "$ENV_FILE" "$GITHUB_WORKSPACE/deploy/vps.env"

          compose() {
            sudo -n docker compose --project-name "$PROJECT" --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"
          }

          rollback_image() {
            local image="$1"
            if sudo -n docker image inspect "$image:latest" >/dev/null 2>&1; then
              sudo -n docker tag "$image:latest" "$image:$ROLLBACK_TAG"
              echo "saved_rollback_image=$image:$ROLLBACK_TAG"
            fi
          }

          # Compose names images "<project>-<service>", so rollback tags must
          # follow the project or they would snapshot the wrong stack.
          rollback_image "${PROJECT}-web"
          rollback_image "${PROJECT}-worker"
          rollback_image "${PROJECT}-migrate"

          echo "--- build release images while production stays up ---"
          compose build web worker migrate

          echo "--- activate release ---"
          compose up -d

          echo "--- wait for web health ---"
          web_id="$(compose ps -q web)"
          worker_id="$(compose ps -q worker)"
          caddy_id="$(compose ps -q caddy)"
          test -n "$web_id" && test -n "$worker_id" && test -n "$caddy_id"

          healthy=false
          for attempt in $(seq 1 30); do
            status="$(sudo -n docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$web_id")"
            echo "web_health_attempt_${attempt}=$status"
            if [ "$status" = "healthy" ]; then
              healthy=true
              break
            fi
            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              break
            fi
            sleep 5
          done

          if [ "$healthy" != true ]; then
            echo "release_health_failed=true"
            echo "--- bounded service status ---"
            compose ps
            echo "--- bounded web logs ---"
            compose logs --no-color --tail=80 web || true
            echo "--- rollback app images ---"
            for image in "${PROJECT}-web" "${PROJECT}-worker"; do
              if sudo -n docker image inspect "$image:$ROLLBACK_TAG" >/dev/null 2>&1; then
                sudo -n docker tag "$image:$ROLLBACK_TAG" "$image:latest"
              fi
            done
            compose up -d --no-deps --force-recreate web worker
            exit 3
          fi

          echo "--- internal application request ---"
          sudo -n docker exec "$web_id" node -e "fetch('http://127.0.0.1:8080/').then(async r=>{console.log('internal_http_status='+r.status); if(!r.ok) process.exit(1)}).catch(e=>{console.error('internal_http_failed'); process.exit(1)})"

          echo "--- final service status ---"
          compose ps
          worker_state="$(sudo -n docker inspect --format '{{.State.Status}}' "$worker_id")"
          caddy_state="$(sudo -n docker inspect --format '{{.State.Status}}' "$caddy_id")"
          echo "worker_state=$worker_state"
          echo "caddy_state=$caddy_state"
          test "$worker_state" = running
          test "$caddy_state" = running
          echo "--- prove the running images carry this release SHA ---"
          revision_ok=true
          for target in web worker; do
            cid="$(compose ps -q "$target")"
            rev="$(sudo -n docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$cid" 2>/dev/null || true)"
            echo "${target}_image_revision=${rev:-<unlabeled>}"
            if [ "$rev" != "$RELEASE_SHA" ]; then revision_ok=false; fi
          done
          echo "expected_release_sha=$RELEASE_SHA"
          if [ "$revision_ok" != true ]; then
            echo "release_revision_mismatch=true"
            exit 4
          fi

          echo "--- confirm the deployed bundle contains current source ---"
          web_id_check="$(compose ps -q web)"
          for marker in prioritizeCandidates conversationThemes discoveryProfile; do
            if sudo -n docker exec "$web_id_check" sh -lc "grep -rqs '$marker' /app" 2>/dev/null; then
              echo "marker_present=$marker"
            else
              echo "marker_absent=$marker"
            fi
          done

          echo "release_verified=true"

      - name: Export release log
        if: always()
        shell: bash
        run: |
          sleep 1
          tail -c 18000 /tmp/release.log > /tmp/release.trim.log 2>/dev/null || echo "no release log" > /tmp/release.trim.log
          echo "log_b64=$(base64 -w0 /tmp/release.trim.log)" >> "$GITHUB_OUTPUT"

# Trigger: deploy the current feature branch into the live demandsift2 project
# with SHA-stamped images, replacing the stale 2026-08-09 production build.

  report:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish the release outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_B64: ${{ needs.deploy.outputs.log_b64 }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          set -Eeuo pipefail
          {
            echo "## VPS release — ${RESULT}"
            echo
            echo '```'
            if [ -n "${LOG_B64:-}" ]; then echo "$LOG_B64" | base64 -d; else echo "no log captured"; fi
            echo '```'
          } > /tmp/r.md
          python3 - <<'PY' > /tmp/body.json
          import json
          print(json.dumps({"body": open("/tmp/r.md").read()[:60000]}))
          PY
          curl -sS -o /dev/null -w 'comment_http=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
            --data @/tmp/body.json
