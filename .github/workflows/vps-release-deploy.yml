name: DemandSift trusted VPS release

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-release-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    outputs:
      log_b64: ${{ steps.exportlog.outputs.log_b64 }}
    steps:
      - name: Check out verified feature head in isolated runner workspace
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit that triggered this run. Checking out the
          # branch name resolved to a stale tip on the reused runner workspace,
          # so a release reported deploying one SHA while building another.
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Deploy through the sanctioned ops interface
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > /tmp/release.log 2>&1

          # The runner has no unrestricted passwordless sudo; its only root
          # interface is /usr/local/bin/demandsift-ops. Generic `sudo docker`
          # and `sudo docker compose` are therefore unavailable and every
          # privileged action goes through the ops verb below.
          OPS="sudo /usr/local/bin/demandsift-ops"
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_sha=$RELEASE_SHA"
          echo "trigger_sha=${{ github.sha }}"
          # A release that builds a different commit than it reports is worse
          # than one that fails, so refuse rather than deploy the wrong code.
          if [ "$RELEASE_SHA" != "${{ github.sha }}" ]; then
            echo "checkout_sha_mismatch=true"
            exit 5
          fi
          echo "runner_user=$(whoami)"

          echo "--- pre-release runtime ---"
          $OPS runtime || echo "ops_runtime_unavailable=true"

          # Preflight: prove what this runner actually sees at execution time,
          # rather than trusting a previous run's log. An earlier report was
          # drawn from a stale comment and wrongly concluded the verb was absent.
          echo "--- ops preflight ---"
          $OPS 2>&1 || true
          $OPS deploy badsha 2>&1 || true
          echo "--- ops status (source checkout visibility) ---"
          $OPS status 2>&1 || true

          echo "--- request deploy ---"
          # Contract for the ops deploy verb:
          #   demandsift-ops deploy <git-sha>
          # It is expected to build web/worker/migrate from that SHA with
          # RELEASE_SHA exported (so deploy/compose.vps.yaml stamps
          # org.opencontainers.image.revision), bring up the demandsift2
          # project reusing its existing database and Caddy volumes, and
          # roll back the previous images on health failure.
          if ! $OPS deploy "$RELEASE_SHA"; then
            echo "ops_deploy_failed=true"
            echo "--- post-failure runtime ---"
            $OPS runtime || true
            echo "--- recent logs ---"
            $OPS logs || true
            exit 3
          fi

          echo "--- post-release runtime ---"
          $OPS runtime > /tmp/runtime.txt 2>&1 || true
          cat /tmp/runtime.txt

          echo "--- prove both containers run this release ---"
          # The runtime verb reports each container's image revision label.
          # A release that cannot prove its own SHA is treated as failed, which
          # is what allowed a 2026-08-09 build to serve production unnoticed.
          missing=0
          for target in web worker; do
            if grep -qi "$target" /tmp/runtime.txt && grep -q "$RELEASE_SHA" /tmp/runtime.txt; then
              echo "${target}_revision_confirmed=true"
            else
              echo "${target}_revision_confirmed=false"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "release_revision_mismatch=true"
            exit 4
          fi

          echo "--- container status ---"
          $OPS status || true

          echo "--- reddit configuration in effect ---"
          $OPS reddit-config || true

          echo "release_verified=true"

      - name: Export release log
        id: exportlog
        if: always()
        shell: bash
        run: |
          sleep 1
          tail -c 18000 /tmp/release.log > /tmp/release.trim.log 2>/dev/null || echo "no release log" > /tmp/release.trim.log
          echo "log_b64=$(base64 -w0 /tmp/release.trim.log)" >> "$GITHUB_OUTPUT"

# Trigger: deploy the current feature branch into the live demandsift2 project
# with SHA-stamped images, replacing the stale 2026-08-09 production build.

  # External, black-box proof. Runs off the VPS so "production works" means
  # reachable from the public internet, not just healthy from inside the host.
  prove:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    outputs:
      proof_b64: ${{ steps.proof.outputs.proof_b64 }}
    env:
      APP_URL: https://demandsift.143-244-154-139.sslip.io
    steps:
      - name: Prove public HTTP and one real queue job
        id: proof
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/proof.md
          {
            echo "### Public production HTTP"
            code="$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "$APP_URL/" || echo 000)"
            echo "GET / -> $code"
            echo "bytes=$(wc -c < /tmp/home.html 2>/dev/null || echo 0)"

            echo
            echo "### Real queue job end-to-end"
            jar=/tmp/jar.txt
            created="$(curl -sS --cookie-jar "$jar" -H 'content-type: application/json' \
              -X POST --data '{"websiteUrl":"https://tvcp.app","defer":true}' \
              --max-time 60 "$APP_URL/api/scans" || echo '{}')"
            scan_id="$(printf '%s' "$created" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("scan") or {}).get("id") or "")' 2>/dev/null || echo '')"
            echo "scan_id=${scan_id:-<none>}"
            if [ -z "$scan_id" ]; then
              echo "scan_create_failed=true"
              echo "response=$(printf '%s' "$created" | head -c 400)"
            else
              status=""
              for i in $(seq 1 90); do
                body="$(curl -sS --cookie "$jar" --max-time 30 \
                  "$APP_URL/api/scans/$scan_id?statusOnly=1" || echo '{}')"
                status="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("scan") or {}).get("status") or "")' 2>/dev/null || echo '')"
                case "$status" in complete|failed) break ;; esac
                sleep 10
              done
              echo "final_status=${status:-<unknown>}"
              # A job that reaches a terminal state proves the worker consumed
              # it from the queue, which is the claim being tested here.
              if [ "$status" = complete ] || [ "$status" = failed ]; then
                echo "queue_job_processed=true"
              else
                echo "queue_job_processed=false"
              fi
            fi
          } > "$OUT" 2>&1
          cat "$OUT"
          echo "proof_b64=$(base64 -w0 "$OUT")" >> "$GITHUB_OUTPUT"

  report:
    needs: [deploy, prove]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish the release outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_B64: ${{ needs.deploy.outputs.log_b64 }}
          PROOF_B64: ${{ needs.prove.outputs.proof_b64 }}
          RESULT: ${{ needs.deploy.result }}
        run: |
          set -Eeuo pipefail
          {
            echo "## VPS release — ${RESULT}"
            echo
            echo '```'
            if [ -n "${LOG_B64:-}" ]; then echo "$LOG_B64" | base64 -d; else echo "no log captured"; fi
            echo '```'
            echo
            if [ -n "${PROOF_B64:-}" ]; then echo "$PROOF_B64" | base64 -d; else echo "no external proof captured"; fi
          } > /tmp/r.md
          python3 - <<'PY' > /tmp/body.json
          import json
          print(json.dumps({"body": open("/tmp/r.md").read()[:60000]}))
          PY
          curl -sS -o /dev/null -w 'comment_http=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
            --data @/tmp/body.json
