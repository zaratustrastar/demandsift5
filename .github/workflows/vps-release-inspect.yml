name: DemandSift VPS release inspect

on:
  push:
    branches:
      - feature/reddit-intelligence-pipeline
    paths:
      - .github/workflows/vps-release-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect deploy state without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          APP=/opt/demandsift5-pr1
          echo "whoami=$(whoami)"
          echo "hostname=$(hostname)"
          echo "app_dir=$APP"
          if [ ! -d "$APP/.git" ] && [ ! -f "$APP/.git" ]; then
            echo "app_git_missing=true"
            exit 2
          fi
          cd "$APP"
          echo "--- git ---"
          git status --short
          git branch --show-current
          git rev-parse HEAD
          git log -n 5 --oneline --decorate
          git worktree list --porcelain | sed -E 's#(https?://)[^/@]+@#\1REDACTED@#g'
          echo "--- deploy files ---"
          find . -maxdepth 2 -type f \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' -o -name 'compose*.yml' -o -name 'compose*.yaml' -o -name 'Dockerfile*' \) -print | sort
          echo "--- containers ---"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          echo "--- compose projects ---"
          docker compose ls || true
          echo "--- recent DemandSift images ---"
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep -Ei 'demandsift|threadline' | head -n 30 || true
          echo "--- listeners ---"
          ss -lnt | head -n 40 || true
          echo "--- resource headroom ---"
          df -h / "$APP" | tail -n +2
          free -h
